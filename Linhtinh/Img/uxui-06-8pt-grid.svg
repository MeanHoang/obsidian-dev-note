<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <pattern id="g8" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0 L0 0 0 16" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    </pattern>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">8-Point Grid: moi spacing &amp; sizing la boi so cua 8 (4 cho tinh chinh nho)</text>

  <!-- button anatomy on grid -->
  <rect x="30" y="60" width="420" height="240" fill="url(#g8)" stroke="#d1d5db"/>
  <text x="30" y="322" font-size="12" fill="#6b7280">Luoi nen: moi o = 8px</text>

  <rect x="126" y="140" width="224" height="64" rx="8" fill="#2563eb"/>
  <circle cx="166" cy="172" r="10" fill="#ffffff" opacity="0.9"/>
  <rect x="192" y="164" width="128" height="16" rx="4" fill="#ffffff" opacity="0.9"/>

  <!-- padding annotations -->
  <line x1="126" y1="128" x2="350" y2="128" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="126" y1="132" x2="126" y2="140" stroke="#2563eb"/>
  <line x1="350" y1="132" x2="350" y2="140" stroke="#2563eb"/>
  <text x="216" y="122" font-size="12" fill="#1d4ed8">bo goc 8</text>

  <line x1="110" y1="140" x2="110" y2="164" stroke="#dc2626" stroke-width="1.5"/>
  <text x="70" y="156" font-size="12" fill="#dc2626">pad-Y 8</text>
  <line x1="126" y1="222" x2="150" y2="222" stroke="#dc2626" stroke-width="1.5"/>
  <text x="126" y="240" font-size="12" fill="#dc2626">pad-X 16</text>
  <line x1="176" y1="212" x2="192" y2="212" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="196" y="216" font-size="12" fill="#7c3aed">icon–text 8</text>

  <!-- right: valid vs invalid -->
  <text x="500" y="84" font-size="14" font-weight="700" fill="#15803d">Hop le (boi so 8 / half-step 4)</text>
  <g font-size="14" fill="#065f46">
    <rect x="500" y="96" width="44" height="30" rx="6" fill="#dcfce7"/><text x="512" y="116">4</text>
    <rect x="552" y="96" width="44" height="30" rx="6" fill="#dcfce7"/><text x="564" y="116">8</text>
    <rect x="604" y="96" width="52" height="30" rx="6" fill="#dcfce7"/><text x="614" y="116">12</text>
    <rect x="664" y="96" width="52" height="30" rx="6" fill="#dcfce7"/><text x="674" y="116">16</text>
    <rect x="724" y="96" width="52" height="30" rx="6" fill="#dcfce7"/><text x="734" y="116">24</text>
    <rect x="784" y="96" width="52" height="30" rx="6" fill="#dcfce7"/><text x="794" y="116">32</text>
  </g>

  <text x="500" y="168" font-size="14" font-weight="700" fill="#b91c1c">Pha vo he thong</text>
  <g font-size="14" fill="#991b1b">
    <rect x="500" y="180" width="44" height="30" rx="6" fill="#fee2e2"/><text x="512" y="200">7</text>
    <rect x="552" y="180" width="44" height="30" rx="6" fill="#fee2e2"/><text x="562" y="200">10</text>
    <rect x="604" y="180" width="52" height="30" rx="6" fill="#fee2e2"/><text x="614" y="200">15</text>
    <rect x="664" y="180" width="52" height="30" rx="6" fill="#fee2e2"/><text x="674" y="200">18</text>
  </g>

  <rect x="500" y="236" width="336" height="70" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="516" y="260" font-size="12.5" fill="#92400e">Ngoai le: border 1px, hairline va line-height</text>
  <text x="516" y="280" font-size="12.5" fill="#92400e">khong bat buoc theo grid. Grid danh cho</text>
  <text x="516" y="300" font-size="12.5" fill="#92400e">spacing &amp; sizing, khong phai moi con so.</text>
</svg>
