<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">Feedback &amp; Confirmation — Undo thay vi "Ban co chac khong?"</text>

  <!-- dialog -->
  <rect x="30" y="58" width="380" height="180" rx="12" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="86" y="88" width="268" height="120" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="220" y="122" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Ban co chac khong?</text>
  <text x="220" y="144" font-size="11.5" fill="#6b7280" text-anchor="middle">Hanh dong nay se xoa muc da chon.</text>
  <rect x="150" y="164" width="90" height="28" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="195" y="182" font-size="11.5" fill="#374151" text-anchor="middle">Huy</text>
  <rect x="248" y="164" width="90" height="28" rx="6" fill="#dc2626"/>
  <text x="293" y="182" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Xoa</text>
  <text x="220" y="228" font-size="11.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Chan thao tac — lam dung se bi bam OK theo phan xa</text>

  <!-- toast undo -->
  <rect x="450" y="58" width="380" height="180" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="468" y="86" font-size="12.5" font-weight="700" fill="#15803d">✅ Lam ngay + toast Undo</text>
  <rect x="468" y="98" width="344" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="482" y="115" font-size="11.5" fill="#374151">Task A</text>
  <rect x="468" y="128" width="344" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="482" y="145" font-size="11.5" fill="#374151">Task B</text>

  <rect x="500" y="176" width="280" height="40" rx="8" fill="#111827"/>
  <text x="518" y="201" font-size="12" fill="#ffffff">Da xoa "Task C"</text>
  <text x="748" y="201" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="end">HOAN TAC</text>
  <text x="640" y="232" font-size="11.5" font-weight="600" fill="#15803d" text-anchor="middle">Nhanh, an toan, ton trong nguoi dung hon</text>

  <!-- rule -->
  <rect x="30" y="256" width="390" height="56" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="48" y="280" font-size="12.5" font-weight="700" fill="#15803d">Hanh dong NHE, dao nguoc duoc</text>
  <text x="48" y="300" font-size="11.5" fill="#166534">→ lam ngay + Undo (toast)</text>

  <rect x="440" y="256" width="390" height="56" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="458" y="280" font-size="12.5" font-weight="700" fill="#b91c1c">Hanh dong NANG, kho/khong dao nguoc</text>
  <text x="458" y="300" font-size="11.5" fill="#991b1b">(xoa vinh vien, thanh toan lon) → confirmation ro rang</text>
</svg>
