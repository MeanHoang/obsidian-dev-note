<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="700" fill="#1f2933">Cho server tra loi vs Optimistic UI (keo task sang "Done")</text>

  <!-- normal -->
  <text x="30" y="72" font-size="13.5" font-weight="600" fill="#6b7280">Binh thuong: doi server roi moi cap nhat</text>
  <rect x="30" y="84" width="150" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="105" y="105" font-size="12" fill="#1f2933" text-anchor="middle">User keo task</text>
  <text x="105" y="121" font-size="11" fill="#6b7280" text-anchor="middle">t = 0ms</text>
  <path d="M188 107 l36 0 m-9 -6 l9 6 l-9 6" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <rect x="232" y="84" width="190" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="327" y="105" font-size="12" fill="#78350f" text-anchor="middle">UI dung im, cho API</text>
  <text x="327" y="121" font-size="11" fill="#92400e" text-anchor="middle">~400ms do tre mang</text>
  <path d="M430 107 l36 0 m-9 -6 l9 6 l-9 6" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <rect x="474" y="84" width="170" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="559" y="111" font-size="12" fill="#1f2933" text-anchor="middle">Task moi nhay sang</text>
  <text x="664" y="112" font-size="12" fill="#991b1b">cam giac cham</text>

  <line x1="30" y1="152" x2="830" y2="152" stroke="#e5e7eb"/>

  <!-- optimistic -->
  <text x="30" y="180" font-size="13.5" font-weight="600" fill="#166534">Optimistic UI: cap nhat ngay, goi server o nen</text>
  <rect x="30" y="192" width="150" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="105" y="213" font-size="12" fill="#1f2933" text-anchor="middle">User keo task</text>
  <text x="105" y="229" font-size="11" fill="#6b7280" text-anchor="middle">t = 0ms</text>
  <path d="M188 215 l36 0 m-9 -6 l9 6 l-9 6" stroke="#9ca3af" stroke-width="2" fill="none"/>
  <rect x="232" y="192" width="190" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="327" y="213" font-size="12" fill="#14532d" text-anchor="middle">Task nhay sang NGAY</text>
  <text x="327" y="229" font-size="11" fill="#3f7f5a" text-anchor="middle">API chay am tham o nen</text>

  <path d="M430 208 l30 -14 m-6 -1 l6 1 l-1 6" stroke="#16a34a" stroke-width="2" fill="none"/>
  <rect x="470" y="170" width="185" height="40" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="562" y="195" font-size="12" fill="#166534" text-anchor="middle">Server OK -&gt; giu nguyen</text>

  <path d="M430 222 l30 14 m-1 -6 l1 6 l-6 1" stroke="#dc2626" stroke-width="2" fill="none"/>
  <rect x="470" y="220" width="185" height="52" rx="8" fill="#fff5f5" stroke="#dc2626"/>
  <text x="562" y="240" font-size="12" fill="#991b1b" text-anchor="middle">Server loi -&gt; rollback</text>
  <text x="562" y="258" font-size="11" fill="#7f1d1d" text-anchor="middle">"Khong luu duoc, thu lai"</text>

  <rect x="672" y="170" width="158" height="102" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="751" y="192" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Chi dung khi</text>
  <text x="751" y="212" font-size="11.5" fill="#78350f" text-anchor="middle">thao tac nhe, de thanh cong</text>
  <text x="751" y="234" font-size="11.5" fill="#991b1b" text-anchor="middle">KHONG dung cho</text>
  <text x="751" y="252" font-size="11.5" fill="#991b1b" text-anchor="middle">thanh toan / tien bac</text>

  <text x="30" y="296" font-size="12.5" fill="#6b7280">Bao "thanh cong gia" roi am tham mat du lieu con te hon la khong dung optimistic UI.</text>
</svg>
