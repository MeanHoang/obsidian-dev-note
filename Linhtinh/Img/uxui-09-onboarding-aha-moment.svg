<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#111827">Onboarding = duong ngan nhat den Aha Moment</text>
  <text x="30" y="60" font-size="13" fill="#6b7280">Muc tieu khong phai gioi thieu tinh nang, ma la cho nguoi dung CHAM vao gia tri</text>

  <!-- flow -->
  <g>
    <rect x="30" y="86" width="150" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="105" y="112" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Dang ky</text>
    <text x="105" y="132" font-size="11" fill="#6366f1" text-anchor="middle">Sign-up</text>

    <path d="M186 117 H222" stroke="#9ca3af" stroke-width="2"/>
    <path d="M222 117 l-9 -5 v10 z" fill="#9ca3af"/>

    <rect x="228" y="86" width="170" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="313" y="112" font-size="13" font-weight="600" fill="#3730a3" text-anchor="middle">Buoc setup toi thieu</text>
    <text x="313" y="132" font-size="11" fill="#6366f1" text-anchor="middle">template / sample data</text>

    <path d="M404 117 H440" stroke="#9ca3af" stroke-width="2"/>
    <path d="M440 117 l-9 -5 v10 z" fill="#9ca3af"/>

    <rect x="446" y="80" width="190" height="74" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
    <text x="541" y="108" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Aha Moment</text>
    <text x="541" y="128" font-size="11" fill="#b45309" text-anchor="middle">lan dau cam nhan gia tri</text>
    <text x="541" y="145" font-size="11" fill="#b45309" text-anchor="middle">cot loi cua san pham</text>

    <path d="M642 117 H678" stroke="#9ca3af" stroke-width="2"/>
    <path d="M678 117 l-9 -5 v10 z" fill="#9ca3af"/>

    <rect x="684" y="86" width="146" height="62" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="757" y="112" font-size="13" font-weight="600" fill="#166534" text-anchor="middle">Quay lai / tra tien</text>
    <text x="757" y="132" font-size="11" fill="#16a34a" text-anchor="middle">Retention</text>
  </g>

  <!-- examples -->
  <text x="30" y="196" font-size="13" font-weight="700" fill="#111827">Aha Moment cua moi san pham mot khac</text>

  <g>
    <rect x="30" y="210" width="260" height="92" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="48" y="236" font-size="13" font-weight="700" fill="#111827">Slack</text>
    <text x="48" y="258" font-size="11.5" fill="#4b5563">Gia tri chi "bat" khi ca team cung chat</text>
    <text x="48" y="278" font-size="11.5" fill="#4b5563">→ onboarding day viec MOI DONG DOI</text>
    <text x="48" y="294" font-size="11.5" fill="#4b5563">va gui tin nhan dau tien</text>

    <rect x="300" y="210" width="260" height="92" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="318" y="236" font-size="13" font-weight="700" fill="#111827">Notion</text>
    <text x="318" y="258" font-size="11.5" fill="#4b5563">Trang trang gay bi ngo</text>
    <text x="318" y="278" font-size="11.5" fill="#4b5563">→ dung TEMPLATE co san de thay ngay</text>
    <text x="318" y="294" font-size="11.5" fill="#4b5563">mot trang dep, co noi dung mau</text>

    <rect x="570" y="210" width="260" height="92" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="588" y="236" font-size="13" font-weight="700" fill="#111827">Canva</text>
    <text x="588" y="258" font-size="11.5" fill="#4b5563">Chon loai thiet ke → mo template</text>
    <text x="588" y="278" font-size="11.5" fill="#4b5563">→ vai giay da co tam hinh</text>
    <text x="588" y="294" font-size="11.5" fill="#4b5563">gan-hoan-chinh</text>
  </g>
</svg>
