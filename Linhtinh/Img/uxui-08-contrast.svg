<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">Contrast ratio - nguong WCAG muc AA</text>

  <rect x="30" y="60" width="390" height="230" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="50" y="90" font-size="15" font-weight="700" fill="#b91c1c">X  Contrast thap - FAIL</text>

  <rect x="50" y="106" width="350" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="132" font-size="15" fill="#c7c7c7">Text thuong mau xam nhat</text>
  <text x="66" y="155" font-size="12.5" fill="#c7c7c7">placeholder lam nhan chinh</text>

  <rect x="50" y="180" width="180" height="44" rx="8" fill="#a5d8ff"/>
  <text x="140" y="207" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Mua hang</text>
  <text x="244" y="199" font-size="13" fill="#b91c1c">nen xanh nhat + chu trang</text>
  <text x="244" y="217" font-size="13" fill="#b91c1c">-&gt; khong dat 4.5:1</text>

  <text x="50" y="252" font-size="13" fill="#7f1d1d">Ngoai nang hoac mat kem = gan nhu khong doc noi.</text>
  <text x="50" y="272" font-size="13" fill="#7f1d1d">Dark mode phai do lai rieng, khong suy ra tu light mode.</text>

  <rect x="440" y="60" width="390" height="230" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="90" font-size="15" font-weight="700" fill="#047857">V  Contrast dat - PASS</text>

  <rect x="460" y="106" width="350" height="60" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="476" y="132" font-size="15" fill="#111827">Text thuong mau dam</text>
  <text x="476" y="155" font-size="12.5" fill="#4b5563">nhan rieng ben tren o input</text>

  <rect x="460" y="180" width="180" height="44" rx="8" fill="#1d4ed8"/>
  <text x="550" y="207" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Mua hang</text>
  <text x="654" y="199" font-size="13" fill="#047857">dam nen len mot chut</text>
  <text x="654" y="217" font-size="13" fill="#047857">-&gt; dat 4.5:1</text>

  <text x="460" y="252" font-size="13" fill="#065f46">Vien input va icon cung phai tach nen it nhat 3:1.</text>

  <rect x="30" y="304" width="800" height="42" rx="8" fill="#f3f4f6"/>
  <text x="46" y="322" font-size="13" fill="#374151">Muc AA: text thuong 4.5:1  |  text lon (~18pt hoac 14pt dam) 3:1  |  thanh phan UI &amp; icon 3:1</text>
  <text x="46" y="340" font-size="13" fill="#6b7280">Muc AAA khat khe hon: 7:1 cho text thuong, 4.5:1 cho text lon.</text>
</svg>
