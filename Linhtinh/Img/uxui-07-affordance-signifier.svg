<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="700" fill="#1f2933">Inline edit trong bang du lieu: thieu vs du signifier</text>
  <text x="30" y="60" font-size="13" fill="#6b7280">Affordance = o text nay sua duoc. Signifier = dau hieu cho user BIET la sua duoc.</text>

  <!-- left: no signifier -->
  <rect x="30" y="82" width="380" height="176" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="50" y="108" font-size="13.5" font-weight="700" fill="#991b1b">X  Nhin y het text thuong</text>
  <rect x="50" y="122" width="340" height="30" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="142" font-size="12.5" fill="#6b7280">Ten project</text>
  <text x="230" y="142" font-size="12.5" fill="#1f2933">Joy Loyalty</text>
  <rect x="50" y="156" width="340" height="30" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="64" y="176" font-size="12.5" fill="#6b7280">Moi truong</text>
  <text x="230" y="176" font-size="12.5" fill="#1f2933">Production</text>
  <text x="50" y="216" font-size="12" fill="#7f1d1d">Khong mau, khong vien, khong icon.</text>
  <text x="50" y="236" font-size="12" fill="#7f1d1d">User khong bao gio biet o nay bam duoc.</text>

  <!-- right: with signifier -->
  <rect x="450" y="82" width="380" height="176" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="108" font-size="13.5" font-weight="700" fill="#166534">OK  Them signifier khi hover</text>
  <rect x="470" y="122" width="340" height="30" rx="5" fill="#eef4ff" stroke="#93b4f5"/>
  <text x="484" y="142" font-size="12.5" fill="#6b7280">Ten project</text>
  <text x="650" y="142" font-size="12.5" fill="#1f2933" text-anchor="middle">Joy Loyalty</text>
  <line x1="596" y1="147" x2="704" y2="147" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <path d="M772 132 l8 -8 l6 6 l-8 8 l-8 2 z"/>
  </g>
  <rect x="470" y="156" width="340" height="30" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="484" y="176" font-size="12.5" fill="#6b7280">Moi truong</text>
  <text x="650" y="176" font-size="12.5" fill="#1f2933" text-anchor="middle">Production</text>
  <text x="470" y="216" font-size="12" fill="#14532d">Nen sang + gach chan net dut + icon but chi</text>
  <text x="470" y="236" font-size="12" fill="#14532d">-&gt; user hieu ngay "sua duoc tai cho".</text>
</svg>
