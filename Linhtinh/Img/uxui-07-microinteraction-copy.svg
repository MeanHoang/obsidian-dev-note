<svg xmlns="http://www.w3.org/2000/svg" width="860" height="270" viewBox="0 0 860 270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="700" fill="#1f2933">Micro-interaction "Copy API key" — 4 phan cua Dan Saffer</text>

  <!-- step 1 trigger -->
  <rect x="30" y="70" width="180" height="70" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="44" y="88" width="152" height="34" rx="6" fill="#2563eb"/>
  <text x="120" y="110" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Copy API key</text>
  <text x="120" y="164" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">1. Trigger</text>
  <text x="120" y="182" font-size="11.5" fill="#6b7280" text-anchor="middle">user bam nut</text>

  <path d="M222 105 l30 0 m-8 -6 l8 6 l-8 6" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- step 2 rules -->
  <rect x="264" y="70" width="180" height="70" rx="8" fill="#f6f8fb" stroke="#d1d5db"/>
  <text x="354" y="98" font-size="12" fill="#4b5563" text-anchor="middle">clipboard.write(key)</text>
  <text x="354" y="120" font-size="12" fill="#4b5563" text-anchor="middle">timer = 2000ms</text>
  <text x="354" y="164" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">2. Rules</text>
  <text x="354" y="182" font-size="11.5" fill="#6b7280" text-anchor="middle">luat chay ben trong</text>

  <path d="M456 105 l30 0 m-8 -6 l8 6 l-8 6" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- step 3 feedback -->
  <rect x="498" y="70" width="180" height="70" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="512" y="88" width="152" height="34" rx="6" fill="#16a34a"/>
  <path d="M544 105 l6 7 l12 -14" stroke="#ffffff" stroke-width="2.6" fill="none"/>
  <text x="600" y="110" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Copied!</text>
  <text x="588" y="164" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">3. Feedback</text>
  <text x="588" y="182" font-size="11.5" fill="#6b7280" text-anchor="middle">user thay ket qua</text>

  <path d="M690 105 l30 0 m-8 -6 l8 6 l-8 6" stroke="#9ca3af" stroke-width="2" fill="none"/>

  <!-- step 4 loop -->
  <rect x="732" y="70" width="98" height="70" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <rect x="742" y="88" width="78" height="34" rx="6" fill="#2563eb"/>
  <text x="781" y="110" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">Copy key</text>
  <text x="781" y="164" font-size="12.5" font-weight="700" fill="#1f2933" text-anchor="middle">4. Loop</text>
  <text x="781" y="182" font-size="11.5" fill="#6b7280" text-anchor="middle">sau 2s tro lai</text>

  <text x="30" y="228" font-size="12.5" fill="#6b7280">Nho nhung co muc dich ro rang: xac nhan "da copy that roi", khong phai trang tri.</text>
  <text x="30" y="250" font-size="12.5" fill="#991b1b">Nhoi micro-interaction o moi noi cho "vui mat" -&gt; giao dien roi va cham.</text>
</svg>
