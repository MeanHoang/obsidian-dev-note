<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#1f2933">Bon cap do noi bat cua nut</text>

  <g>
    <rect x="30" y="58" width="170" height="42" rx="8" fill="#2563eb"/>
    <text x="115" y="85" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Create project</text>
    <text x="115" y="122" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">Primary</text>
    <text x="115" y="139" font-size="11.5" fill="#6b7280" text-anchor="middle">nen dac - 1 cai / khu vuc</text>
  </g>
  <g>
    <rect x="240" y="58" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="325" y="85" font-size="14" font-weight="600" fill="#2563eb" text-anchor="middle">Import CSV</text>
    <text x="325" y="122" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">Secondary</text>
    <text x="325" y="139" font-size="11.5" fill="#6b7280" text-anchor="middle">vien / nen nhat</text>
  </g>
  <g>
    <rect x="450" y="58" width="170" height="42" rx="8" fill="#f3f6fb"/>
    <text x="535" y="85" font-size="14" fill="#2563eb" text-anchor="middle">View docs</text>
    <text x="535" y="122" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">Tertiary</text>
    <text x="535" y="139" font-size="11.5" fill="#6b7280" text-anchor="middle">gan nhu mot link co mau</text>
  </g>
  <g>
    <rect x="660" y="58" width="170" height="42" rx="8" fill="#ffffff"/>
    <text x="745" y="85" font-size="14" fill="#6b7280" text-anchor="middle">Cancel</text>
    <text x="745" y="122" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">Ghost</text>
    <text x="745" y="139" font-size="11.5" fill="#6b7280" text-anchor="middle">khong nen, khong vien</text>
  </g>

  <line x1="30" y1="160" x2="830" y2="160" stroke="#e5e7eb"/>

  <!-- bad -->
  <rect x="30" y="180" width="390" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="48" y="206" font-size="13.5" font-weight="700" fill="#991b1b">X  Ba nut cung noi nhu nhau</text>
  <text x="48" y="230" font-size="12.5" fill="#1f2933">Xoa project "joy-prod"?</text>
  <rect x="48" y="246" width="105" height="36" rx="7" fill="#2563eb"/>
  <text x="100" y="269" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Delete</text>
  <rect x="163" y="246" width="105" height="36" rx="7" fill="#2563eb"/>
  <text x="215" y="269" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Cancel</text>
  <rect x="278" y="246" width="105" height="36" rx="7" fill="#2563eb"/>
  <text x="330" y="269" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Archive</text>
  <text x="48" y="300" font-size="11.5" fill="#7f1d1d">User te liet lua chon - moi thu noi = chang gi noi.</text>

  <!-- good -->
  <rect x="440" y="180" width="390" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="458" y="206" font-size="13.5" font-weight="700" fill="#166534">OK  Ro thu bac</text>
  <text x="458" y="230" font-size="12.5" fill="#1f2933">Xoa project "joy-prod"?</text>
  <rect x="458" y="246" width="150" height="36" rx="7" fill="#dc2626"/>
  <text x="533" y="269" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Delete project</text>
  <rect x="618" y="246" width="90" height="36" rx="7" fill="#ffffff"/>
  <text x="663" y="269" font-size="12.5" fill="#6b7280" text-anchor="middle">Cancel</text>
  <text x="458" y="300" font-size="11.5" fill="#14532d">Destructive primary do + Cancel ghost khong tranh chu y.</text>
</svg>
