<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">GEO-bench — cach viet lai noi dung nao duoc engine trich dan</text>
  <text x="430" y="46" text-anchor="middle" font-size="11.5" fill="#6b7280">Aggarwal et al., KDD 2024 — 10.000 query, 25 domain — metric Position-Adjusted Word Count</text>

  <!-- baseline line: x for value v => 260 + (v-15)*44 ; 15->260, 28->832 -->
  <line x1="260" y1="66" x2="260" y2="356" stroke="#d1d5db"/>
  <line x1="260" y1="356" x2="836" y2="356" stroke="#d1d5db"/>
  <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#9ca3af">15</text>
  <text x="480" y="374" text-anchor="middle" font-size="10.5" fill="#9ca3af">20</text>
  <text x="700" y="374" text-anchor="middle" font-size="10.5" fill="#9ca3af">25</text>

  <!-- bars -->
  <text x="248" y="88" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">Quotation Addition</text>
  <rect x="260" y="75" width="537" height="20" rx="4" fill="#1e7e45"/>
  <text x="805" y="90" font-size="12.5" font-weight="700" fill="#1e7e45">27,2</text>

  <text x="248" y="118" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">Statistics Addition</text>
  <rect x="260" y="105" width="449" height="20" rx="4" fill="#2f9159"/>
  <text x="717" y="120" font-size="12.5" font-weight="700" fill="#1e7e45">25,2</text>

  <text x="248" y="148" text-anchor="end" font-size="12.5" fill="#374151">Fluency Optimization</text>
  <rect x="260" y="135" width="427" height="20" rx="4" fill="#5aac7d"/>
  <text x="695" y="150" font-size="12.5" fill="#374151">24,7</text>

  <text x="248" y="178" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">Cite Sources</text>
  <rect x="260" y="165" width="422" height="20" rx="4" fill="#3f9e63"/>
  <text x="690" y="180" font-size="12.5" font-weight="700" fill="#1e7e45">24,6</text>

  <text x="248" y="208" text-anchor="end" font-size="12.5" fill="#374151">Technical Terms</text>
  <rect x="260" y="195" width="339" height="20" rx="4" fill="#8cc7a6"/>
  <text x="607" y="210" font-size="12.5" fill="#374151">22,7</text>

  <text x="248" y="238" text-anchor="end" font-size="12.5" fill="#374151">Easy-to-Understand</text>
  <rect x="260" y="225" width="308" height="20" rx="4" fill="#9ed0b4"/>
  <text x="576" y="240" font-size="12.5" fill="#374151">22,0</text>

  <text x="248" y="268" text-anchor="end" font-size="12.5" fill="#374151">Authoritative</text>
  <rect x="260" y="255" width="277" height="20" rx="4" fill="#b2dbc2"/>
  <text x="545" y="270" font-size="12.5" fill="#374151">21,3</text>

  <text x="248" y="298" text-anchor="end" font-size="12.5" fill="#374151">Unique Words</text>
  <rect x="260" y="285" width="242" height="20" rx="4" fill="#c8e6d3"/>
  <text x="510" y="300" font-size="12.5" fill="#374151">20,5</text>

  <text x="248" y="328" text-anchor="end" font-size="12.5" font-weight="700" fill="#b3261e">Keyword Stuffing</text>
  <rect x="260" y="315" width="119" height="20" rx="4" fill="#d93025"/>
  <text x="387" y="330" font-size="12.5" font-weight="700" fill="#b3261e">17,7 — THAP HON baseline</text>

  <!-- baseline 19,3 -> 260 + 4,3*44 = 449 (ve sau cung de nam tren cac thanh) -->
  <line x1="449" y1="66" x2="449" y2="366" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="374" y="384" width="150" height="20" rx="4" fill="#fef3c7"/>
  <text x="449" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">baseline = 19,3</text>

  <text x="20" y="424" font-size="11.5" fill="#6b7280">Trich dan nguyen van + so lieu cu the thang dam. Nhoi tu khoa khong chi vo dung ma con te hon viet binh thuong.</text>
</svg>
