    <text x="330" y="152" font-size="12.5" font-weight="600" fill="#1f2933" text-anchor="middle">2. Hover</text>
    <text x="330" y="169" font-size="11.5" fill="#6b7280" text-anchor="middle">dam hon - "bam duoc"</text>
  </g>
  <g>
    <rect x="450" y="86" width="188" height="52" rx="11" fill="none" stroke="#f59e0b" stroke-width="3"/>
