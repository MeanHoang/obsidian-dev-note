    <text x="544" y="169" font-size="11.5" fill="#b45309" text-anchor="middle">tuyet doi khong xoa vien</text>
  </g>
  <g>
    <rect x="668" y="94" width="172" height="40" rx="8" fill="#1e40af"/>
