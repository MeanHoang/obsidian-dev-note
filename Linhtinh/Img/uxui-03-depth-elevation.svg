<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <filter id="hard" x="-30%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
    <filter id="e1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0b1220" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
    <filter id="e2" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1220" flood-opacity="0.13"/>
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b1220" flood-opacity="0.13"/>
    </filter>
    <filter id="e3" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1220" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Depth &amp; Elevation &#8212; thang do noi, moi muc dung HAI lop bong</text>

  <!-- WRONG -->
  <rect x="20" y="46" width="230" height="300" rx="10" fill="#fdf3f2" stroke="#e8b4ae" stroke-width="1.5"/>
  <text x="40" y="74" font-size="14" font-weight="700" fill="#b3261e">&#10007; Bong den dac, cung</text>
  <rect x="56" y="100" width="150" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#hard)"/>
  <text x="131" y="146" text-anchor="middle" font-size="13" fill="#374151">Card</text>
  <rect x="56" y="212" width="150" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" filter="url(#hard)"/>
  <text x="131" y="258" text-anchor="middle" font-size="13" fill="#374151">Modal</text>
  <text x="40" y="316" font-size="12" fill="#b3261e">Cung mot muc bong cho moi thu</text>
  <text x="40" y="334" font-size="12" fill="#b3261e">&#8594; mat luon y nghia phan lop.</text>

  <!-- CORRECT -->
  <rect x="270" y="46" width="570" height="300" rx="10" fill="#f6f8fa" stroke="#d8dde5" stroke-width="1.5"/>
  <text x="292" y="74" font-size="14" font-weight="700" fill="#1e7e45">&#10003; Thang do noi nhat quan: nghi &#8594; noi nhe &#8594; noi cao</text>

  <rect x="300" y="110" width="150" height="100" rx="10" fill="#ffffff" filter="url(#e1)"/>
  <text x="375" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Card nghi</text>
  <text x="375" y="172" text-anchor="middle" font-size="11" fill="#9ca3af">bong rat nhe,</text>
  <text x="375" y="188" text-anchor="middle" font-size="11" fill="#9ca3af">gan nhu dan sat nen</text>

  <rect x="480" y="102" width="150" height="100" rx="10" fill="#ffffff" filter="url(#e2)"/>
  <text x="555" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Card hover / keo tha</text>
  <text x="555" y="164" text-anchor="middle" font-size="11" fill="#9ca3af">bong lon hon, mem hon</text>
  <text x="555" y="180" text-anchor="middle" font-size="11" fill="#9ca3af">&#8212; "nhac len khoi mat ban"</text>

  <rect x="660" y="92" width="150" height="100" rx="10" fill="#ffffff" filter="url(#e3)"/>
  <text x="735" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Modal / Dropdown</text>
  <text x="735" y="154" text-anchor="middle" font-size="11" fill="#9ca3af">bong ro va toa rong</text>
  <text x="735" y="170" text-anchor="middle" font-size="11" fill="#9ca3af">&#8212; lop tren cung</text>

  <!-- inset input -->
  <text x="300" y="252" font-size="12" font-weight="600" fill="#4b5563">O input thi nguoc lai &#8212; trong hoi "lom xuong" de moi goi dien vao:</text>
  <rect x="300" y="264" width="260" height="34" rx="6" fill="#f3f4f6" stroke="#c9cfd8"/>
  <line x1="301" y1="266" x2="559" y2="266" stroke="#aab2bd" stroke-width="2"/>
  <text x="316" y="286" font-size="12" fill="#9ca3af">Nhap email...</text>

  <text x="300" y="330" font-size="12" fill="#4b5563">Do noi ti le voi tam quan trong &amp; muc do tuong tac. Phan lon noi dung nen PHANG.</text>
</svg>
