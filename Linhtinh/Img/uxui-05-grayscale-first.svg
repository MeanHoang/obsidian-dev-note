<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#111827">Grayscale-first: dung hierarchy bang XAM truoc, mau them sau cung</text>

  <!-- gray scale strip -->
  <text x="30" y="62" font-size="13" font-weight="700" fill="#374151">Can mot thang xam PHONG PHU (50-900), khong phai vai muc</text>
  <g>
    <rect x="30" y="72" width="88" height="34" fill="#F9FAFB" stroke="#e5e7eb"/>
    <rect x="118" y="72" width="88" height="34" fill="#F3F4F6"/>
    <rect x="206" y="72" width="88" height="34" fill="#E5E7EB"/>
    <rect x="294" y="72" width="88" height="34" fill="#D1D5DB"/>
    <rect x="382" y="72" width="88" height="34" fill="#9CA3AF"/>
    <rect x="470" y="72" width="88" height="34" fill="#6B7280"/>
    <rect x="558" y="72" width="88" height="34" fill="#4B5563"/>
    <rect x="646" y="72" width="88" height="34" fill="#374151"/>
    <rect x="734" y="72" width="96" height="34" fill="#111827"/>
    <text x="74" y="94" font-size="11" fill="#6B7280" text-anchor="middle">50</text>
    <text x="162" y="94" font-size="11" fill="#6B7280" text-anchor="middle">100</text>
    <text x="250" y="94" font-size="11" fill="#6B7280" text-anchor="middle">200</text>
    <text x="338" y="94" font-size="11" fill="#4B5563" text-anchor="middle">300</text>
    <text x="426" y="94" font-size="11" fill="#ffffff" text-anchor="middle">400</text>
    <text x="514" y="94" font-size="11" fill="#ffffff" text-anchor="middle">500</text>
    <text x="602" y="94" font-size="11" fill="#ffffff" text-anchor="middle">600</text>
    <text x="690" y="94" font-size="11" fill="#ffffff" text-anchor="middle">700</text>
    <text x="782" y="94" font-size="11" fill="#ffffff" text-anchor="middle">900</text>
  </g>
  <text x="30" y="124" font-size="11" fill="#9CA3AF">nen · vien · chu phu · chu chinh — moi vai tro mot bac</text>

  <!-- step 1 -->
  <text x="30" y="164" font-size="14" font-weight="700" fill="#374151">Buoc 1 — chi xam: hierarchy da doc duoc?</text>
  <rect x="30" y="176" width="390" height="200" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="50" y="208" font-size="17" font-weight="700" fill="#111827">Doanh thu thang 8</text>
  <text x="50" y="228" font-size="12" fill="#9CA3AF">Cap nhat 5 phut truoc</text>
  <text x="50" y="272" font-size="30" font-weight="700" fill="#111827">1.284.000</text>
  <text x="50" y="292" font-size="12" fill="#6B7280">+12% so voi thang truoc</text>
  <rect x="50" y="312" width="120" height="36" rx="6" fill="#374151"/>
  <text x="110" y="335" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Xem chi tiet</text>
  <rect x="182" y="312" width="90" height="36" rx="6" fill="#ffffff" stroke="#D1D5DB"/>
  <text x="227" y="335" font-size="13" fill="#6B7280" text-anchor="middle">Huy</text>

  <!-- step 2 -->
  <text x="440" y="164" font-size="14" font-weight="700" fill="#047857">Buoc 2 — them mau: chi lam manh them</text>
  <rect x="440" y="176" width="390" height="200" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="460" y="208" font-size="17" font-weight="700" fill="#111827">Doanh thu thang 8</text>
  <text x="460" y="228" font-size="12" fill="#9CA3AF">Cap nhat 5 phut truoc</text>
  <text x="460" y="272" font-size="30" font-weight="700" fill="#111827">1.284.000</text>
  <text x="460" y="292" font-size="12" font-weight="600" fill="#047857">+12% so voi thang truoc</text>
  <rect x="460" y="312" width="120" height="36" rx="6" fill="#2563EB"/>
  <text x="520" y="335" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Xem chi tiet</text>
  <rect x="592" y="312" width="90" height="36" rx="6" fill="#ffffff" stroke="#D1D5DB"/>
  <text x="637" y="335" font-size="13" fill="#6B7280" text-anchor="middle">Huy</text>
  <text x="460" y="366" font-size="11" fill="#9CA3AF">Nut phu VAN la xam — khong phai cai gi cung can mau</text>
</svg>
