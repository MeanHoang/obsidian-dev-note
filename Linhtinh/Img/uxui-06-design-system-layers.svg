  <rect x="286" y="62" width="288" height="52" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="306" y="86" font-size="13.5" font-weight="700" fill="#5b21b6">4. Guidelines</text>
  <text x="306" y="105" font-size="11.5" fill="#7c3aed">khi nao dung cai gi</text>

  <rect x="222" y="122" width="416" height="52" rx="8" fill="#fdf2f8" stroke="#f9a8d4"/>
  <text x="242" y="146" font-size="13.5" font-weight="700" fill="#9d174d">3. Patterns &amp; Layout</text>
  <text x="242" y="165" font-size="11.5" fill="#be185d">ghep component thanh trang, dua tren spacing scale</text>

  <rect x="158" y="182" width="544" height="52" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="178" y="206" font-size="13.5" font-weight="700" fill="#115e59">2. Components</text>
  <text x="178" y="225" font-size="11.5" fill="#0d9488">nut, input, card... duoc xay BANG token</text>

  <rect x="94" y="242" width="672" height="66" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="114" y="268" font-size="13.5" font-weight="700" fill="#1e40af">1. Tokens (nen mong)</text>
