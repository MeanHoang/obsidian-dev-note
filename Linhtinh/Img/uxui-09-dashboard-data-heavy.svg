<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="32" font-size="19" font-weight="700" fill="#111827">Dashboard &amp; Data-Heavy UI — mat do cao van phai quet duoc</text>
  <text x="30" y="54" font-size="12" fill="#6b7280">Data density cao chi hieu qua khi co cau truc thi giac ro rang</text>

  <rect x="30" y="68" width="800" height="292" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- KPI row -->
  <g>
    <rect x="48" y="86" width="184" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="64" y="108" font-size="11" fill="#6b7280">Doanh thu thang</text>
    <text x="64" y="138" font-size="24" font-weight="700" fill="#111827">$48.2k</text>
    <text x="168" y="138" font-size="11.5" font-weight="600" fill="#16a34a">▲ 12%</text>

    <rect x="242" y="86" width="184" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="258" y="108" font-size="11" fill="#6b7280">Nguoi dung active</text>
    <text x="258" y="138" font-size="24" font-weight="700" fill="#111827">1,284</text>
    <text x="352" y="138" font-size="11.5" font-weight="600" fill="#16a34a">▲ 4%</text>

    <rect x="436" y="86" width="184" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="452" y="108" font-size="11" fill="#6b7280">Churn</text>
    <text x="452" y="138" font-size="24" font-weight="700" fill="#111827">2.1%</text>
    <text x="530" y="138" font-size="11.5" font-weight="600" fill="#dc2626">▼ 0.3%</text>

    <!-- sparkline card -->
    <rect x="630" y="86" width="182" height="72" rx="9" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="646" y="108" font-size="11" fill="#6b7280">Xu huong 30 ngay</text>
    <polyline points="648,146 668,138 688,142 708,126 728,132 748,118 768,122 796,108" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  </g>

  <!-- filter bar -->
  <g>
    <rect x="48" y="174" width="200" height="28" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <circle cx="64" cy="188" r="5" fill="none" stroke="#9ca3af" stroke-width="1.8"/>
    <path d="M68 192 l5 5" stroke="#9ca3af" stroke-width="1.8"/>
    <text x="80" y="192" font-size="11.5" fill="#9ca3af">Tim kiem...</text>

    <rect x="258" y="174" width="104" height="28" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text x="272" y="192" font-size="11.5" fill="#374151">Trang thai ▾</text>

    <rect x="372" y="174" width="104" height="28" rx="7" fill="#ffffff" stroke="#d1d5db"/>
    <text x="386" y="192" font-size="11.5" fill="#374151">Thoi gian ▾</text>

    <rect x="486" y="174" width="96" height="28" rx="7" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="500" y="192" font-size="11.5" fill="#3730a3">Plan: Growth ✕</text>
    <text x="600" y="192" font-size="11" fill="#9ca3af">Filter / sort quan trong hon cach trinh bay</text>
  </g>

  <!-- table -->
  <g>
    <rect x="48" y="216" width="764" height="30" fill="#f9fafb"/>
    <text x="62" y="236" font-size="11" font-weight="700" fill="#6b7280">KHACH HANG</text>
    <text x="300" y="236" font-size="11" font-weight="700" fill="#6b7280">GOI</text>
    <text x="420" y="236" font-size="11" font-weight="700" fill="#6b7280">TRANG THAI</text>
    <text x="700" y="236" font-size="11" font-weight="700" fill="#6b7280" text-anchor="end">MRR</text>
    <text x="798" y="236" font-size="11" font-weight="700" fill="#6b7280" text-anchor="end">▸</text>

    <line x1="48" y1="246" x2="812" y2="246" stroke="#e5e7eb"/>
    <text x="62" y="270" font-size="12" font-weight="600" fill="#111827">Acme Store</text>
    <text x="300" y="270" font-size="11.5" fill="#6b7280">Growth</text>
    <rect x="420" y="258" width="60" height="18" rx="9" fill="#dcfce7"/>
    <text x="450" y="271" font-size="10.5" font-weight="600" fill="#166534" text-anchor="middle">Active</text>
    <text x="700" y="270" font-size="12" fill="#111827" text-anchor="end">$1,240</text>
    <text x="798" y="270" font-size="12" fill="#9ca3af" text-anchor="end">▸</text>

    <line x1="48" y1="282" x2="812" y2="282" stroke="#f3f4f6"/>
    <text x="62" y="306" font-size="12" font-weight="600" fill="#111827">Bloom Shop</text>
    <text x="300" y="306" font-size="11.5" fill="#6b7280">Starter</text>
    <rect x="420" y="294" width="60" height="18" rx="9" fill="#fef3c7"/>
    <text x="450" y="307" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle">Trial</text>
    <text x="700" y="306" font-size="12" fill="#111827" text-anchor="end">$90</text>
    <text x="798" y="306" font-size="12" fill="#9ca3af" text-anchor="end">▸</text>

    <line x1="48" y1="318" x2="812" y2="318" stroke="#f3f4f6"/>
    <text x="62" y="342" font-size="12" font-weight="600" fill="#111827">Citrus Co</text>
    <text x="300" y="342" font-size="11.5" fill="#6b7280">Enterprise</text>
    <rect x="420" y="330" width="60" height="18" rx="9" fill="#fee2e2"/>
    <text x="450" y="343" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Churn</text>
    <text x="700" y="342" font-size="12" fill="#111827" text-anchor="end">$4,900</text>
    <text x="798" y="342" font-size="12" fill="#9ca3af" text-anchor="end">▸</text>
  </g>

  <text x="30" y="384" font-size="11.5" fill="#6b7280">So can le theo cot  •  chi so quan trong noi bat, thong tin phu mo di  •  hien cot quan trong, mo chi tiet theo hang (▸)</text>
  <text x="30" y="404" font-size="11.5" fill="#6b7280">Dung chart khi can thay xu huong, dung bang khi can con so chinh xac</text>
</svg>
