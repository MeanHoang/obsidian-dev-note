<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Crawl de TRAIN va crawl de TRA LOI user la hai bot khac nhau</text>
  <text x="430" y="46" text-anchor="middle" font-size="11.5" fill="#6b7280">Vi du user-agent cua OpenAI (tai lieu chinh thuc)</text>

  <!-- site box -->
  <rect x="330" y="66" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="430" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">Website cua ban</text>

  <path d="M400 112 L230 150" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M460 112 L630 150" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- GPTBot -->
  <rect x="30" y="152" width="380" height="200" rx="10" fill="#f1f9f4" stroke="#a8d5b9" stroke-width="1.5"/>
  <text x="52" y="180" font-size="14.5" font-weight="700" fill="#1e7e45">GPTBot</text>
  <text x="52" y="202" font-size="12.5" fill="#374151">Muc dich: thu thap content DE TRAIN model</text>
  <rect x="52" y="216" width="336" height="52" rx="8" fill="#ffffff" stroke="#cfe6d8"/>
  <text x="70" y="238" font-size="12.5" font-weight="600" fill="#111827">Chan no thi sao?</text>
  <text x="70" y="258" font-size="12.5" fill="#1e7e45">Khong anh huong viec xuat hien trong</text>
  <text x="70" y="276" font-size="12.5" fill="#1e7e45">ChatGPT search</text>
  <text x="52" y="306" font-size="13" font-weight="700" fill="#1e7e45">&#10003; Chan la mot quyet dinh hop le</text>
  <text x="52" y="330" font-size="12" fill="#4b5563">Neu ban khong muon noi dung bi dung de train</text>

  <!-- OAI-SearchBot -->
  <rect x="450" y="152" width="380" height="200" rx="10" fill="#fdf3f2" stroke="#e8b4ae" stroke-width="1.5"/>
  <text x="472" y="180" font-size="14.5" font-weight="700" fill="#b3261e">OAI-SearchBot</text>
  <text x="472" y="202" font-size="12.5" fill="#374151">Muc dich: dua website VAO KET QUA SEARCH</text>
  <rect x="472" y="216" width="336" height="52" rx="8" fill="#ffffff" stroke="#f0d3d0"/>
  <text x="490" y="238" font-size="12.5" font-weight="600" fill="#111827">Chan no thi sao?</text>
  <text x="490" y="258" font-size="12.5" font-weight="700" fill="#b3261e">Bien mat khoi ChatGPT search —</text>
  <text x="490" y="276" font-size="12.5" font-weight="700" fill="#b3261e">agent khong bao gio biet app ban ton tai</text>
  <text x="472" y="306" font-size="13" font-weight="700" fill="#b3261e">&#10007; Chan = tu ban vao chan</text>
  <text x="472" y="330" font-size="12" fill="#4b5563">Loi hay gap: copy robots.txt "chan AI" tu blog ve dan</text>

  <text x="20" y="372" font-size="11.5" fill="#6b7280">Anthropic tach tuong tu: ClaudeBot (training) · Claude-User (khi user hoi) · Claude-SearchBot (index cho search).</text>
  <text x="20" y="390" font-size="11.5" fill="#6b7280">Luu y: robots.txt phai dat o top-level cua TUNG subdomain.</text>
</svg>
