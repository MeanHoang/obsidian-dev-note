<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#111827">Palette = mau co VAI TRO, khong phai mau chon tuy hung</text>

  <rect x="30" y="50" width="200" height="70" rx="8" fill="#2563EB"/>
  <text x="46" y="76" font-size="14" font-weight="700" fill="#ffffff">Primary</text>
  <text x="46" y="96" font-size="11" fill="#DBEAFE">nut chinh · link · active</text>
  <text x="46" y="112" font-size="11" fill="#BFDBFE">xuat hien nhieu nhat</text>

  <rect x="242" y="50" width="200" height="70" rx="8" fill="#6B7280"/>
  <text x="258" y="76" font-size="14" font-weight="700" fill="#ffffff">Secondary</text>
  <text x="258" y="96" font-size="11" fill="#E5E7EB">hanh dong it quan trong</text>
  <text x="258" y="112" font-size="11" fill="#D1D5DB">SaaS: dung XAM la du</text>

  <rect x="454" y="50" width="200" height="70" rx="8" fill="#7C3AED"/>
  <text x="470" y="76" font-size="14" font-weight="700" fill="#ffffff">Accent</text>
  <text x="470" y="96" font-size="11" fill="#EDE9FE">badge "moi" · highlight</text>
  <text x="470" y="112" font-size="11" fill="#DDD6FE">dung RAT tiet che</text>

  <rect x="666" y="50" width="164" height="70" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="682" y="76" font-size="14" font-weight="700" fill="#374151">Neutral</text>
  <text x="682" y="96" font-size="11" fill="#6B7280">nen · vien · chu</text>
  <text x="682" y="112" font-size="11" fill="#9CA3AF">chiem phan lon giao dien</text>

  <text x="30" y="152" font-size="13" font-weight="700" fill="#374151">Cung mot dashboard, moi vai tro dung dung cho</text>
  <rect x="30" y="164" width="800" height="130" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="52" y="196" font-size="16" font-weight="700" fill="#111827">Du an cua ban</text>
  <rect x="196" y="182" width="52" height="20" rx="10" fill="#7C3AED"/>
  <text x="222" y="196" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Beta</text>
  <text x="52" y="220" font-size="12" fill="#6B7280">Quan ly toan bo du an trong workspace nay.</text>

  <rect x="52" y="238" width="130" height="38" rx="6" fill="#2563EB"/>
  <text x="117" y="262" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Tao du an</text>
  <rect x="194" y="238" width="90" height="38" rx="6" fill="#ffffff" stroke="#D1D5DB"/>
  <text x="239" y="262" font-size="13" fill="#6B7280" text-anchor="middle">Huy</text>

  <text x="310" y="252" font-size="12" fill="#9CA3AF">Nut chinh = primary · nut "Huy" = xam (khong can mau)</text>
  <text x="310" y="270" font-size="12" fill="#9CA3AF">Nhan "Beta" = accent, chi mot diem duy nhat tren man hinh</text>

  <text x="30" y="318" font-size="12" fill="#B91C1C">X Sai lam: moi vai tro chi chon DUNG 1 gia tri mau — thuc te moi vai tro can ca mot thang 50-900.</text>
</svg>
