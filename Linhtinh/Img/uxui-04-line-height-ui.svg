<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1f2937">Body 16px va tieu de 36px can line-height khac nhau</text>

  <rect x="24" y="48" width="386" height="190" rx="10" fill="#fdf1f1" stroke="#e35d5d" stroke-width="2"/>
  <text x="44" y="74" font-size="13" font-weight="700" fill="#c62828">Body 16px / line-height 1.0 - qua sit</text>
  <text x="44" y="98" font-size="16" fill="#111">Mo ta trong bang gia noi ro ban duoc</text>
  <text x="44" y="114" font-size="16" fill="#111">bao nhieu luot goi API moi thang va gioi</text>
  <text x="44" y="130" font-size="16" fill="#111">han so thanh vien trong workspace.</text>
  <text x="44" y="158" font-size="13" font-weight="700" fill="#c62828">Tieu de 36px / line-height 1.5 - bi banh ra</text>
  <text x="44" y="186" font-size="26" font-weight="700" fill="#111">Bang gia</text>
  <text x="44" y="225" font-size="26" font-weight="700" fill="#111">linh hoat</text>

  <rect x="450" y="48" width="386" height="190" rx="10" fill="#f1faf3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="470" y="74" font-size="13" font-weight="700" fill="#1e7a42">Body 16px / line-height 1.5 - de doc</text>
  <text x="470" y="98" font-size="16" fill="#111">Mo ta trong bang gia noi ro ban duoc</text>
  <text x="470" y="122" font-size="16" fill="#111">bao nhieu luot goi API moi thang va gioi</text>
  <text x="470" y="146" font-size="16" fill="#111">han so thanh vien trong workspace.</text>
  <text x="470" y="178" font-size="13" font-weight="700" fill="#1e7a42">Tieu de 36px / line-height 1.1 - gon khoi</text>
  <text x="470" y="204" font-size="26" font-weight="700" fill="#111">Bang gia</text>
  <text x="470" y="232" font-size="26" font-weight="700" fill="#111">linh hoat</text>

  <rect x="24" y="256" width="812" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="282" font-size="14" font-weight="700" fill="#1f2937">Quan he nghich can nho</text>
  <text x="44" y="306" font-size="14" fill="#374151">Dong cang DAI  -&gt;  line-height cang LON</text>
  <text x="44" y="328" font-size="14" fill="#374151">Chu cang NHO  -&gt;  line-height cang LON  |  Chu cang TO  -&gt;  line-height cang NHO</text>
</svg>
