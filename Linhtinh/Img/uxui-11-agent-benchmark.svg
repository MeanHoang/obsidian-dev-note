<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Agent thao tac web gioi den dau — ti le hoan thanh task</text>
  <text x="430" y="46" text-anchor="middle" font-size="11.5" fill="#6b7280">WebArena (2023, moi truong mo phong) va Online-Mind2Web (COLM 2025, 300 task / 136 website that)</text>

  <!-- axis: 0% -> x=250 ; 100% -> x=810 => 5.6 px per % -->
