  <!-- note box -->
  <rect x="20" y="322" width="820" height="44" rx="8" fill="#fff8ec" stroke="#e8c99a"/>
  <text x="38" y="342" font-size="12" font-weight="700" fill="#92400e">Chi tiet de bo qua: nhom Online-Mind2Web da LOC BO cac website co CAPTCHA khi dung dataset.</text>
  <text x="38" y="360" font-size="12" fill="#92400e">Nghia la 61,3% cua Operator la con so da tru di moi site co CAPTCHA — con so that tren web mo con thap hon.</text>
