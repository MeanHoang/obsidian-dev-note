  <text x="810" y="306" text-anchor="middle" font-size="10.5" fill="#9ca3af">100%</text>

  <text x="238" y="88" text-anchor="end" font-size="12.5" font-weight="700" fill="#111827">Con nguoi (WebArena)</text>
  <rect x="250" y="75" width="438" height="22" rx="4" fill="#374151"/>
  <text x="698" y="91" font-size="12.5" font-weight="700" fill="#111827">78,24%</text>

  <text x="238" y="124" text-anchor="end" font-size="12.5" fill="#374151">Operator</text>
  <rect x="250" y="111" width="343" height="22" rx="4" fill="#1a5fb4"/>
  <text x="603" y="127" font-size="12.5" font-weight="700" fill="#1a5fb4">61,3%</text>

  <text x="238" y="160" text-anchor="end" font-size="12.5" fill="#374151">Claude Computer Use 3.7</text>
  <rect x="250" y="147" width="315" height="22" rx="4" fill="#4a86d8"/>
  <text x="575" y="163" font-size="12.5" fill="#374151">56,3%</text>

  <text x="238" y="196" text-anchor="end" font-size="12.5" fill="#374151">SeeAct</text>
  <rect x="250" y="183" width="172" height="22" rx="4" fill="#9bbfeb"/>
  <text x="432" y="199" font-size="12.5" fill="#374151">30,7%</text>

  <text x="238" y="232" text-anchor="end" font-size="12.5" fill="#374151">Browser Use</text>
