<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="700" fill="#1f2933">Motion: duration va easing</text>

  <!-- duration bar -->
  <text x="30" y="72" font-size="13.5" font-weight="600" fill="#1f2933">Duration (thoi luong)</text>
  <rect x="30" y="84" width="800" height="26" rx="5" fill="#f3f4f6"/>
  <rect x="30" y="84" width="200" height="26" rx="5" fill="#bfdbfe"/>
  <rect x="230" y="84" width="180" height="26" fill="#86efac"/>
  <rect x="410" y="84" width="120" height="26" fill="#fde68a"/>
  <rect x="530" y="84" width="300" height="26" rx="5" fill="#fecaca"/>
  <text x="130" y="102" font-size="11.5" fill="#1e3a5f" text-anchor="middle">150-200ms: desktop, phan tu nho</text>
  <text x="320" y="102" font-size="11.5" fill="#14532d" text-anchor="middle">200-300ms: phan lon UI</text>
  <text x="470" y="102" font-size="11.5" fill="#78350f" text-anchor="middle">300-400ms</text>
  <text x="680" y="102" font-size="11.5" fill="#7f1d1d" text-anchor="middle">&gt;= 500ms: user thay cham chap</text>
  <text x="470" y="128" font-size="11" fill="#6b7280" text-anchor="middle">(mobile, chuyen doi lon)</text>

  <!-- easing curves -->
  <text x="30" y="168" font-size="13.5" font-weight="600" fill="#1f2933">Easing (gia toc)</text>

  <g>
    <rect x="30" y="180" width="180" height="100" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
    <path d="M50 265 L190 195" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <text x="120" y="292" font-size="12" fill="#991b1b" text-anchor="middle">Linear — may moc</text>
  </g>
  <g>
    <rect x="240" y="180" width="180" height="100" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
    <path d="M260 265 C 290 195, 340 195, 400 195" stroke="#16a34a" stroke-width="2.5" fill="none"/>
    <text x="330" y="292" font-size="12" fill="#166534" text-anchor="middle">Ease-out — cho thu xuat hien</text>
  </g>
  <g>
    <rect x="450" y="180" width="180" height="100" rx="8" fill="#fafafa" stroke="#e5e7eb"/>
    <path d="M470 265 C 520 265, 560 195, 610 195" stroke="#2563eb" stroke-width="2.5" fill="none"/>
    <text x="540" y="292" font-size="12" fill="#1e40af" text-anchor="middle">Ease-in-out — di chuyen</text>
  </g>
  <g>
    <rect x="660" y="180" width="170" height="100" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="745" y="206" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">Purpose</text>
    <text x="745" y="226" font-size="11" fill="#6b7280" text-anchor="middle">modal truot len tu nut</text>
    <text x="745" y="242" font-size="11" fill="#6b7280" text-anchor="middle">vua bam -&gt; thay lien he</text>
    <text x="745" y="264" font-size="11" fill="#991b1b" text-anchor="middle">ton trong reduced motion</text>
  </g>
</svg>
