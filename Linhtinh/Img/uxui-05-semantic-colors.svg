<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">Semantic colors — mau gan voi Y NGHIA, khong phai voi brand</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">Moi trang thai = 1 mau + 1 icon + 1 chu (khong bao gio chi dua vao mau)</text>

  <!-- Success -->
  <g>
    <rect x="30" y="78" width="390" height="52" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
    <circle cx="58" cy="104" r="11" fill="#059669"/>
    <path d="M52.5 104 l4 4 l9 -9" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="100" font-size="14" font-weight="700" fill="#065F46">Success — Da luu thay doi</text>
    <text x="80" y="119" font-size="12" fill="#047857">green · hoan tat, hop le</text>
  </g>
  <!-- Warning -->
  <g>
    <rect x="440" y="78" width="390" height="52" rx="8" fill="#FFFBEB" stroke="#FCD34D"/>
    <circle cx="468" cy="104" r="11" fill="#D97706"/>
    <text x="468" y="109" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
    <text x="490" y="100" font-size="14" font-weight="700" fill="#92400E">Warning — Ban dung thu con 3 ngay</text>
    <text x="490" y="119" font-size="12" fill="#B45309">yellow / orange · can chu y, chua nguy hiem</text>
  </g>
  <!-- Error -->
  <g>
    <rect x="30" y="146" width="390" height="52" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <circle cx="58" cy="172" r="11" fill="#DC2626"/>
    <path d="M53 167 l10 10 M63 167 l-10 10" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="80" y="168" font-size="14" font-weight="700" fill="#991B1B">Error — Email sai dinh dang</text>
    <text x="80" y="187" font-size="12" fill="#B91C1C">red · that bai, hanh dong pha huy</text>
  </g>
  <!-- Info -->
  <g>
    <rect x="440" y="146" width="390" height="52" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <circle cx="468" cy="172" r="11" fill="#2563EB"/>
    <text x="468" y="177" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">i</text>
    <text x="490" y="168" font-size="14" font-weight="700" fill="#1E3A8A">Info — Meo: co the keo tha the</text>
    <text x="490" y="187" font-size="12" fill="#1D4ED8">blue · thong bao trung tinh, goi y</text>
  </g>

  <line x1="30" y1="222" x2="830" y2="222" stroke="#e5e7eb"/>

  <!-- Bad vs good -->
  <text x="30" y="250" font-size="14" font-weight="700" fill="#B91C1C">X Chi dung mau</text>
  <rect x="30" y="262" width="180" height="42" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="44" y="288" font-size="13" fill="#991B1B">Email khong hop le</text>

  <text x="250" y="250" font-size="14" font-weight="700" fill="#047857">OK Mau + icon + chu</text>
  <rect x="250" y="262" width="240" height="42" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <circle cx="272" cy="283" r="9" fill="#DC2626"/>
  <path d="M268 279 l8 8 M276 279 l-8 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="290" y="288" font-size="13" fill="#991B1B">Loi: Email khong hop le</text>

  <text x="520" y="250" font-size="14" font-weight="700" fill="#374151">Vi sao?</text>
  <text x="520" y="272" font-size="12" fill="#6b7280">Nguoi mu mau khong phan biet do / xanh la.</text>
  <text x="520" y="291" font-size="12" fill="#6b7280">Icon va chu la kenh thong tin thu hai.</text>
</svg>
