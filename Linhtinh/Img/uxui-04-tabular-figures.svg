<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#1f2937">Bang so trong dashboard: tabular figures giup so thang cot</text>

  <rect x="24" y="48" width="386" height="180" rx="10" fill="#fdf1f1" stroke="#e35d5d" stroke-width="2"/>
  <text x="44" y="74" font-size="13" font-weight="700" fill="#c62828">Chu so ti le (proportional) - so 1 hep hon so 8</text>
  <text x="44" y="98" font-size="12" fill="#7a3535">Cot so le lech, cap nhat realtime lam so nhay</text>
  <text x="44" y="124" font-size="12" fill="#6b7280">Thang</text>
  <text x="290" y="124" font-size="12" fill="#6b7280" text-anchor="end">Doanh thu</text>
  <line x1="44" y1="132" x2="390" y2="132" stroke="#e5c9c9"/>
  <text x="44" y="154" font-size="14" fill="#111">Thang 1</text>
  <text x="290" y="154" font-size="15" fill="#111" text-anchor="end">1.111.111</text>
  <text x="44" y="178" font-size="14" fill="#111">Thang 2</text>
  <text x="284" y="178" font-size="15" fill="#111" text-anchor="end">8.888.888</text>
  <text x="44" y="202" font-size="14" fill="#111">Thang 3</text>
  <text x="287" y="202" font-size="15" fill="#111" text-anchor="end">4.517.203</text>
  <text x="44" y="222" font-size="11.5" fill="#c62828">Chieu rong moi so khac nhau -&gt; hang don vi khong khop</text>

  <rect x="450" y="48" width="386" height="180" rx="10" fill="#f1faf3" stroke="#2e9e5b" stroke-width="2"/>
  <text x="470" y="74" font-size="13" font-weight="700" fill="#1e7a42">Tabular figures - moi chu so rong bang nhau</text>
  <text x="470" y="98" font-size="12" fill="#2c5c40">font-variant-numeric: tabular-nums</text>
  <text x="470" y="124" font-size="12" fill="#6b7280">Thang</text>
  <text x="716" y="124" font-size="12" fill="#6b7280" text-anchor="end">Doanh thu</text>
  <line x1="470" y1="132" x2="816" y2="132" stroke="#c9e5d3"/>
  <text x="470" y="154" font-size="14" fill="#111">Thang 1</text>
  <text x="716" y="154" font-size="15" font-family="Menlo, Consolas, monospace" fill="#111" text-anchor="end">1.111.111</text>
  <text x="470" y="178" font-size="14" fill="#111">Thang 2</text>
  <text x="716" y="178" font-size="15" font-family="Menlo, Consolas, monospace" fill="#111" text-anchor="end">8.888.888</text>
  <text x="470" y="202" font-size="14" fill="#111">Thang 3</text>
  <text x="716" y="202" font-size="15" font-family="Menlo, Consolas, monospace" fill="#111" text-anchor="end">4.517.203</text>
  <text x="470" y="222" font-size="11.5" fill="#1e7a42">Hang don vi thang cot, so khong nhay khi cap nhat</text>

  <rect x="24" y="242" width="812" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="44" y="270" font-size="13.5" fill="#374151">Ly tuong cho SaaS: 1 sans-serif trung tinh cho UI (Inter / system stack) + 1 monospace cho code, ID, API key</text>
</svg>
