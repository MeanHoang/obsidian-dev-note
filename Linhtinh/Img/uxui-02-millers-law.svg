<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Miller's Law: chia thong tin thanh "chunk" co nghia</text>

  <!-- phone number -->
  <g transform="translate(20,60)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#b91c1c">✗ Day lien</text>
    <rect x="0" y="12" width="360" height="52" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="180" y="46" font-size="26" fill="#111827" text-anchor="middle" letter-spacing="2">0987654321</text>
    <text x="0" y="86" font-size="12" fill="#b91c1c">10 don vi roi rac → kho doc, kho nho</text>

    <text x="440" y="0" font-size="14" font-weight="600" fill="#047857">✓ Chunk 3-3-4</text>
    <rect x="440" y="12" width="360" height="52" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="620" y="46" font-size="26" fill="#111827" text-anchor="middle" letter-spacing="2">098 765 4321</text>
    <text x="440" y="86" font-size="12" fill="#047857">3 chunk → vua suc tri nho lam viec</text>
  </g>

  <!-- form sections -->
  <g transform="translate(20,190)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#b91c1c">✗ Form 12 field lien tuc</text>
    <g fill="#ffffff" stroke="#d1d5db">
      <rect x="0" y="12" width="360" height="16" rx="3"/><rect x="0" y="34" width="360" height="16" rx="3"/>
      <rect x="0" y="56" width="360" height="16" rx="3"/><rect x="0" y="78" width="360" height="16" rx="3"/>
      <rect x="0" y="100" width="360" height="16" rx="3"/><rect x="0" y="122" width="360" height="16" rx="3"/>
    </g>

    <text x="440" y="0" font-size="14" font-weight="600" fill="#047857">✓ Chia section co tieu de</text>
    <text x="440" y="24" font-size="12" font-weight="700" fill="#374151">Thong tin ca nhan</text>
    <g fill="#ffffff" stroke="#d1d5db">
      <rect x="440" y="30" width="360" height="14" rx="3"/><rect x="440" y="48" width="360" height="14" rx="3"/>
    </g>
    <text x="440" y="82" font-size="12" font-weight="700" fill="#374151">Thanh toan</text>
    <g fill="#ffffff" stroke="#d1d5db">
      <rect x="440" y="88" width="360" height="14" rx="3"/><rect x="440" y="106" width="360" height="14" rx="3"/>
    </g>
    <text x="440" y="140" font-size="12" font-weight="700" fill="#374151">Xac nhan</text>
  </g>
</svg>
