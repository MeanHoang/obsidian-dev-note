<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Contrast &amp; Scale — tieu de so voi doan van</text>

  <rect x="20" y="46" width="390" height="270" rx="10" fill="#fdf3f2" stroke="#e8b4ae" stroke-width="1.5"/>
  <text x="40" y="74" font-size="15" font-weight="700" fill="#b3261e">&#10007; Tuong phan nua voi (16px vs 15px)</text>
  <rect x="44" y="88" width="342" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="118" font-size="16" font-weight="600" fill="#111827">Bao cao doanh thu</text>
  <text x="66" y="144" font-size="15" fill="#111827">Doanh thu thang nay tang so voi thang</text>
  <text x="66" y="166" font-size="15" fill="#111827">truoc nho chien dich khuyen mai cuoi</text>
  <text x="66" y="188" font-size="15" fill="#111827">tuan va luong khach quay lai.</text>
  <text x="66" y="216" font-size="15" fill="#111827">Cap nhat luc 09:30</text>
  <text x="44" y="266" font-size="13" fill="#b3261e">Chenh lech qua nho &#8594; hierarchy vo hinh,</text>
  <text x="44" y="286" font-size="13" fill="#b3261e">phai doc moi biet dau la tieu de.</text>

  <rect x="450" y="46" width="390" height="270" rx="10" fill="#f1f9f4" stroke="#a8d5b9" stroke-width="1.5"/>
  <text x="470" y="74" font-size="15" font-weight="700" fill="#1e7e45">&#10003; Dut khoat: size + weight + mau</text>
  <rect x="474" y="88" width="342" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="496" y="126" font-size="26" font-weight="800" fill="#111827">Bao cao doanh thu</text>
  <text x="496" y="154" font-size="14" fill="#4b5563">Doanh thu thang nay tang so voi thang</text>
  <text x="496" y="176" font-size="14" fill="#4b5563">truoc nho chien dich khuyen mai cuoi</text>
  <text x="496" y="198" font-size="14" fill="#4b5563">tuan va luong khach quay lai.</text>
  <text x="496" y="222" font-size="12" fill="#a8aeb8">Cap nhat luc 09:30</text>
  <text x="474" y="266" font-size="13" fill="#1e7e45">3 muc ro rang: tieu de &#8594; noi dung &#8594; ghi chu.</text>
  <text x="474" y="286" font-size="13" fill="#1e7e45">Nhin phat biet ngay, khong can doc.</text>
</svg>
