<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">Focus ring &amp; Tab order</text>

  <rect x="30" y="58" width="390" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="50" y="86" font-size="15" font-weight="700" fill="#b91c1c">X  outline: none</text>
  <text x="50" y="108" font-size="13" fill="#7f1d1d">Dang Tab toi nut nay, nhung khong thay gi ca</text>
  <rect x="50" y="122" width="150" height="44" rx="8" fill="#1d4ed8"/>
  <text x="125" y="149" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Luu</text>
  <rect x="216" y="122" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="291" y="149" font-size="14.5" fill="#374151" text-anchor="middle">Huy</text>
  <text x="50" y="192" font-size="13" fill="#b91c1c">Nguoi dung ban phim bi "mu" - khong biet minh dang o dau.</text>

  <rect x="440" y="58" width="390" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="460" y="86" font-size="15" font-weight="700" fill="#047857">V  Focus ring ro rang</text>
  <text x="460" y="108" font-size="13" fill="#065f46">Vien sang bao quanh phan tu dang duoc focus</text>
  <rect x="456" y="118" width="158" height="52" rx="11" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <rect x="460" y="122" width="150" height="44" rx="8" fill="#1d4ed8"/>
  <text x="535" y="149" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Luu</text>
  <rect x="626" y="122" width="150" height="44" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="701" y="149" font-size="14.5" fill="#374151" text-anchor="middle">Huy</text>
  <text x="460" y="192" font-size="13" fill="#047857">Luon biet "toi dang o day" -&gt; Enter/Space kich hoat.</text>

  <text x="30" y="248" font-size="15" font-weight="700" fill="#111827">Tab order di theo trinh tu doc: trai -&gt; phai, tren -&gt; xuong (bam thu tu trong HTML)</text>

  <rect x="30" y="264" width="800" height="122" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>

  <rect x="46" y="278" width="240" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="166" y="298" font-size="12.5" fill="#92400e" text-anchor="middle">Skip link: "Bo qua menu, toi noi dung"</text>
  <circle cx="300" cy="293" r="12" fill="#f59e0b"/>
  <text x="300" y="298" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="46" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="106" y="342" font-size="13" fill="#374151" text-anchor="middle">Trang chu</text>
  <circle cx="180" cy="337" r="12" fill="#3b82f6"/>
  <text x="180" y="342" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <rect x="204" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="264" y="342" font-size="13" fill="#374151" text-anchor="middle">San pham</text>
  <circle cx="338" cy="337" r="12" fill="#3b82f6"/>
  <text x="338" y="342" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <rect x="362" y="320" width="120" height="34" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="422" y="342" font-size="13" fill="#374151" text-anchor="middle">O tim kiem</text>
  <circle cx="496" cy="337" r="12" fill="#3b82f6"/>
  <text x="496" y="342" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <rect x="560" y="278" width="256" height="94" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="576" y="300" font-size="13" font-weight="700" fill="#1d4ed8">Modal mo ra: focus trap</text>
  <text x="576" y="322" font-size="12.5" fill="#1e3a8a">Focus nhay VAO trong modal</text>
  <text x="576" y="342" font-size="12.5" fill="#1e3a8a">va bi "nhot" o do toi khi dong</text>
  <text x="576" y="362" font-size="12.5" fill="#1e3a8a">-&gt; khong Tab lac ra nen bi che</text>
</svg>
