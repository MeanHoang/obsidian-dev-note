  <text x="50" y="268" font-size="13" fill="#b91c1c">Phai tu va lai tat ca bang tay - thuong va thieu</text>

  <rect x="440" y="58" width="390" height="240" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
