<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Grid 12 cot — sidebar 3 cot + noi dung 9 cot, ben trong la 4 card x 3 cot</text>

  <!-- 12 column guides: area x=40..820, 12 cols, gutter 12 -->
  <g>
    <!-- col width = (780 - 11*12)/12 = (780-132)/12 = 54 -->
    <rect x="40" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="106" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="172" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="238" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="304" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="370" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="436" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="502" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="568" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="634" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="700" y="46" width="54" height="300" fill="#eef2ff"/>
    <rect x="766" y="46" width="54" height="300" fill="#eef2ff"/>
  </g>
  <g font-size="10" fill="#8b93a7" text-anchor="middle">
    <text x="67" y="60">1</text><text x="133" y="60">2</text><text x="199" y="60">3</text>
    <text x="265" y="60">4</text><text x="331" y="60">5</text><text x="397" y="60">6</text>
    <text x="463" y="60">7</text><text x="529" y="60">8</text><text x="595" y="60">9</text>
    <text x="661" y="60">10</text><text x="727" y="60">11</text><text x="793" y="60">12</text>
  </g>

  <!-- sidebar: cols 1-3 => x 40 to 226 (width 186) -->
  <rect x="40" y="72" width="186" height="262" rx="8" fill="#374151"/>
  <text x="133" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Sidebar</text>
  <text x="133" y="174" text-anchor="middle" font-size="12" fill="#c3c8d0">3 cot</text>
  <text x="133" y="200" text-anchor="middle" font-size="11" fill="#9ca3af">(nen de rong CO DINH,</text>
  <text x="133" y="216" text-anchor="middle" font-size="11" fill="#9ca3af">khong co gian theo %)</text>

  <!-- content area: cols 4-12 => x 238 to 820 -->
  <text x="248" y="94" font-size="12" font-weight="600" fill="#4b5563">Noi dung chinh &#8212; 9 cot</text>
  <!-- 4 cards, each ~3 cols but inside 9 cols -> split evenly: from 238 to 820 = 582, 4 cards gutter 12 => card=(582-36)/4=136.5 -->
  <g>
    <rect x="238" y="104" width="136" height="120" rx="8" fill="#ffffff" stroke="#93a3c9" stroke-width="1.5"/>
    <text x="306" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Card</text>
    <rect x="386" y="104" width="136" height="120" rx="8" fill="#ffffff" stroke="#93a3c9" stroke-width="1.5"/>
    <text x="454" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Card</text>
    <rect x="534" y="104" width="136" height="120" rx="8" fill="#ffffff" stroke="#93a3c9" stroke-width="1.5"/>
    <text x="602" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Card</text>
    <rect x="682" y="104" width="138" height="120" rx="8" fill="#ffffff" stroke="#93a3c9" stroke-width="1.5"/>
    <text x="751" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Card</text>
  </g>
  <rect x="238" y="240" width="582" height="94" rx="8" fill="#ffffff" stroke="#93a3c9" stroke-width="1.5"/>
  <text x="529" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">Bang du lieu &#8212; chiem tron 9 cot</text>

  <text x="40" y="368" font-size="13" fill="#4b5563">12 chia het cho 2, 3, 4, 6 &#8594; de tao bo cuc 6+6, 4+4+4, 3+3+3+3 ma van can doi.</text>
  <text x="40" y="390" font-size="13" fill="#4b5563">Man hinh nho: cac cot "gop lai" &#8212; moi card chiem du 12 cot, xep doc thanh 1 cot.</text>
  <text x="40" y="412" font-size="13" fill="#b3261e">Dung ep moi thu chay theo % &#8212; sidebar, avatar, icon nen co kich thuoc co dinh.</text>
</svg>
