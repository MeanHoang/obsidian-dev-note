<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Von Restorff Effect: cai KHAC BIET la cai duoc nho</text>

  <!-- all same -->
  <g transform="translate(20,60)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#b91c1c">✗ Moi thu deu noi bat = chang gi noi bat</text>
    <rect x="0" y="36" width="118" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="130" y="36" width="118" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="260" y="36" width="118" height="120" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <g font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="600">
      <text x="59" y="72">Basic</text><text x="189" y="72">Pro</text><text x="319" y="72">Enterprise</text>
    </g>
    <g text-anchor="middle">
      <rect x="20" y="114" width="78" height="26" rx="5" fill="#2563eb"/><text x="59" y="132" font-size="12" fill="#fff">Chon</text>
      <rect x="150" y="114" width="78" height="26" rx="5" fill="#2563eb"/><text x="189" y="132" font-size="12" fill="#fff">Chon</text>
      <rect x="280" y="114" width="78" height="26" rx="5" fill="#2563eb"/><text x="319" y="132" font-size="12" fill="#fff">Chon</text>
    </g>
    <text x="0" y="184" font-size="12" fill="#b91c1c">Mat khong biet nhin dau truoc</text>
  </g>

  <!-- one highlighted -->
  <g transform="translate(450,60)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#047857">✓ Mot diem nhan duy nhat</text>
    <rect x="0" y="36" width="118" height="120" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="130" y="30" width="118" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="260" y="36" width="118" height="120" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="154" y="18" width="70" height="20" rx="10" fill="#f59e0b"/>
    <text x="189" y="32" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Popular</text>
    <g font-size="13" text-anchor="middle">
      <text x="59" y="72" fill="#6b7280">Basic</text>
      <text x="189" y="72" fill="#1d4ed8" font-weight="700">Pro</text>
      <text x="319" y="72" fill="#6b7280">Enterprise</text>
    </g>
    <g text-anchor="middle">
      <rect x="20" y="114" width="78" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/><text x="59" y="132" font-size="12" fill="#6b7280">Chon</text>
      <rect x="150" y="118" width="78" height="30" rx="5" fill="#2563eb"/><text x="189" y="138" font-size="12" fill="#fff" font-weight="700">Chon</text>
      <rect x="280" y="114" width="78" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/><text x="319" y="132" font-size="12" fill="#6b7280">Chon</text>
    </g>
    <text x="0" y="184" font-size="12" fill="#047857">Nut phu dang ghost/outline → mat bi hut vao CTA chinh</text>
