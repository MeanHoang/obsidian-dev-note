<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">Constrained Scale — moi thuoc tinh chi co vai "cua" de chon</text>

  <!-- input free -->
  <text x="30" y="70" font-size="14" font-weight="700" fill="#b91c1c">Vo han lua chon</text>
  <rect x="30" y="82" width="250" height="200" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="48" y="112" font-size="13" fill="#991b1b">border-radius: ?</text>
  <g font-size="12.5" fill="#991b1b">
    <text x="48" y="140">3px  5px  6px  7px  9px</text>
    <text x="48" y="164">10px  11px  13px  14px</text>
    <text x="48" y="188">"bo 6 hay 7 nhi?"</text>
  </g>
  <text x="48" y="228" font-size="12.5" fill="#dc2626">→ quyet dinh lai moi lan code</text>
  <text x="48" y="250" font-size="12.5" fill="#dc2626">→ hang chuc gia tri gan-giong-nhau</text>

  <text x="300" y="190" font-size="26" fill="#9ca3af">→</text>

  <!-- constrained -->
  <text x="344" y="70" font-size="14" font-weight="700" fill="#15803d">Constrained: chi 3 cua</text>
  <rect x="344" y="82" width="486" height="200" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>

  <rect x="376" y="112" width="120" height="70" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="386" y="152" font-size="12.5" fill="#166534">input</text>
  <text x="376" y="204" font-size="13" font-weight="700" fill="#15803d">nho — 4px</text>

  <rect x="524" y="112" width="120" height="70" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="534" y="152" font-size="12.5" fill="#166534">card</text>
  <text x="524" y="204" font-size="13" font-weight="700" fill="#15803d">vua — 8px</text>

  <rect x="672" y="112" width="120" height="70" rx="35" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="694" y="152" font-size="12.5" fill="#166534">avatar / pill</text>
  <text x="672" y="204" font-size="13" font-weight="700" fill="#15803d">tron — 999px</text>

  <text x="376" y="248" font-size="12.5" fill="#15803d">Nguyen tac nay ap cho MOI thuoc tinh: spacing · font-size · line-height</text>
  <text x="376" y="268" font-size="12.5" fill="#15803d">· mau · border-radius · shadow · do rong vien.</text>

  <text x="30" y="312" font-size="12.5" fill="#374151">"Define your systems in advance" — quyet dinh mot lan trong he thong, dung mai; thay so ngoai scale khi review = red flag.</text>
</svg>
