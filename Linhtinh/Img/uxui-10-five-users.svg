<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="am" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#374151"/></marker></defs>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#111827">Quy tac "5 users": moi dot 5 nguoi &#8594; ~85% van de, roi SUA va test lai</text>

  <!-- 5 users row -->
  <g>
    <text x="30" y="72" font-size="13.5" font-weight="600" fill="#374151">Mot dot test</text>
    <g fill="#3b82f6">
      <circle cx="150" cy="76" r="11"/><path d="M133 104 a17 17 0 0 1 34 0 z"/>
      <circle cx="196" cy="76" r="11"/><path d="M179 104 a17 17 0 0 1 34 0 z"/>
      <circle cx="242" cy="76" r="11"/><path d="M225 104 a17 17 0 0 1 34 0 z"/>
      <circle cx="288" cy="76" r="11"/><path d="M271 104 a17 17 0 0 1 34 0 z"/>
      <circle cx="334" cy="76" r="11"/><path d="M317 104 a17 17 0 0 1 34 0 z"/>
    </g>
    <g fill="#d1d5db">
      <circle cx="390" cy="76" r="11"/><path d="M373 104 a17 17 0 0 1 34 0 z"/>
      <circle cx="436" cy="76" r="11"/><path d="M419 104 a17 17 0 0 1 34 0 z"/>
    </g>
    <text x="462" y="84" font-size="12.5" fill="#6b7280">nguoi thu 6, 7 chu yeu</text>
    <text x="462" y="102" font-size="12.5" fill="#6b7280">gap lai loi cu &#8594; hieu qua giam dan</text>
  </g>

  <!-- iteration loop -->
  <text x="30" y="152" font-size="13.5" font-weight="600" fill="#374151">Vong lap</text>
  <rect x="150" y="128" width="140" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="220" y="154" font-size="13.5" font-weight="600" fill="#1d4ed8" text-anchor="middle">Test 5 nguoi</text>
  <line x1="290" y1="149" x2="330" y2="149" stroke="#374151" stroke-width="2" marker-end="url(#am)"/>
  <rect x="338" y="128" width="140" height="42" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="408" y="154" font-size="13.5" font-weight="600" fill="#854d0e" text-anchor="middle">Sua thiet ke</text>
  <line x1="478" y1="149" x2="518" y2="149" stroke="#374151" stroke-width="2" marker-end="url(#am)"/>
  <rect x="526" y="128" width="140" height="42" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="596" y="154" font-size="13.5" font-weight="600" fill="#166534" text-anchor="middle">Test lai dot moi</text>
  <path d="M596 170 L596 192 L220 192 L220 172" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
  <text x="682" y="146" font-size="12.5" fill="#374151">Nhieu dot nho, sua lien tuc</text>
  <text x="682" y="164" font-size="12.5" fill="#374151">tot hon mot dot lon ton kem</text>

  <!-- multi group -->
  <rect x="30" y="212" width="390" height="96" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="46" y="236" font-size="13.5" font-weight="700" fill="#111827">Nhieu nhom nguoi dung thi test rieng</text>
  <text x="46" y="260" font-size="12.5" fill="#374151">2 nhom (vd admin / end-user): ~3-4 nguoi moi nhom</text>
  <text x="46" y="282" font-size="12.5" fill="#374151">Tu 3 nhom tro len: ~3 nguoi moi nhom</text>
  <text x="46" y="300" font-size="11.5" fill="#6b7280">(goi y cua NN/g - cac nhom van trung lap van de)</text>

  <rect x="440" y="212" width="390" height="96" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="456" y="236" font-size="13.5" font-weight="700" fill="#b91c1c">Nguoi quan sat: NGOI IM</text>
  <text x="456" y="260" font-size="12.5" fill="#7f1d1d">Khong goi y "bam nut goc tren kia kia"</text>
  <text x="456" y="282" font-size="12.5" fill="#7f1d1d">Khong test voi dong nghiep / ban be</text>
  <text x="456" y="300" font-size="11.5" fill="#7f1d1d">Ky thuat: think-aloud - user noi to suy nghi</text>
</svg>
