<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b7280"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">Design Tokens — 3 tang: Component → Alias/Semantic → Global</text>

  <!-- columns -->
  <text x="46" y="72" font-size="13.5" font-weight="700" fill="#7c3aed">3. Component Token</text>
  <text x="46" y="90" font-size="11.5" fill="#6b7280">rieng cho 1 component</text>
  <text x="326" y="72" font-size="13.5" font-weight="700" fill="#0d9488">2. Alias / Semantic Token</text>
  <text x="326" y="90" font-size="11.5" fill="#6b7280">mang Y NGHIA su dung</text>
  <text x="606" y="72" font-size="13.5" font-weight="700" fill="#2563eb">1. Global / Primitive</text>
  <text x="606" y="90" font-size="11.5" fill="#6b7280">gia tri tho, bang nguyen lieu</text>

  <!-- row 1: color -->
  <rect x="40" y="106" width="230" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="56" y="130" font-size="13" fill="#5b21b6" font-weight="700">button.background</text>
  <text x="56" y="148" font-size="11.5" fill="#7c3aed">nen cua nut</text>

  <line x1="272" y1="132" x2="316" y2="132" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="320" y="106" width="230" height="52" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="336" y="130" font-size="13" fill="#115e59" font-weight="700">color.action.primary</text>
  <text x="336" y="148" font-size="11.5" fill="#0d9488">mau cua hanh dong chinh</text>

  <line x1="552" y1="132" x2="596" y2="132" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="600" y="106" width="230" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="616" y="130" font-size="13" fill="#1e3a8a" font-weight="700">blue-500</text>
  <rect x="712" y="116" width="20" height="20" rx="4" fill="#3b82f6"/>
  <text x="616" y="148" font-size="11.5" fill="#2563eb">gia tri that: ma mau xanh</text>

  <!-- row 2: spacing -->
  <rect x="40" y="180" width="230" height="52" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="56" y="204" font-size="13" fill="#5b21b6" font-weight="700">button.padding.x</text>
  <text x="56" y="222" font-size="11.5" fill="#7c3aed">padding ngang cua nut</text>

  <line x1="272" y1="206" x2="316" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="320" y="180" width="230" height="52" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="336" y="204" font-size="13" fill="#115e59" font-weight="700">spacing.md</text>
  <text x="336" y="222" font-size="11.5" fill="#0d9488">buoc gian cach co ban</text>

  <line x1="552" y1="206" x2="596" y2="206" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="600" y="180" width="230" height="52" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="616" y="204" font-size="13" fill="#1e3a8a" font-weight="700">space-4</text>
  <text x="616" y="222" font-size="11.5" fill="#2563eb">gia tri that: 16px</text>

  <!-- benefit -->
  <rect x="40" y="258" width="790" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="58" y="280" font-size="12.5" fill="#15803d">Doi mau thuong hieu? Sua <tspan font-weight="700">blue-500</tspan> mot cho — moi thu phia tren tu cap nhat.</text>
  <text x="58" y="300" font-size="12.5" fill="#15803d">Tang alias chinh la thu lam theming (light/dark) kha thi: chi can alias tro sang bo global khac.</text>

  <!-- anti pattern -->
  <rect x="40" y="326" width="790" height="48" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="58" y="348" font-size="12.5" fill="#b91c1c">Sai: component tro THANG vao global —</text>
  <text x="286" y="348" font-size="12.5" fill="#991b1b" font-family="ui-monospace, Menlo, monospace">button.background → blue-500</text>
  <text x="58" y="366" font-size="12.5" fill="#991b1b">mat tang alias, khong theme duoc, doi mau phai sua hang loat.</text>
</svg>
