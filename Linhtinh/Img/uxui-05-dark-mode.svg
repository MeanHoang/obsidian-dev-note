<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#111827">Dark mode KHONG phai dao mau — no la mot theme duoc thiet ke lai</text>

  <!-- BAD -->
  <text x="30" y="66" font-size="14" font-weight="700" fill="#B91C1C">X Invert cung: nen #000, chu #FFF, mau brand giu nguyen do ruc</text>
  <rect x="30" y="78" width="390" height="180" rx="8" fill="#000000"/>
  <text x="50" y="110" font-size="16" font-weight="700" fill="#FFFFFF">Doanh thu thang 8</text>
  <rect x="50" y="126" width="350" height="70" rx="6" fill="#000000" stroke="#333333"/>
  <text x="66" y="152" font-size="13" fill="#FFFFFF">Card khong tach duoc khoi nen</text>
  <text x="66" y="176" font-size="12" fill="#FFFFFF">shadow vo dung tren nen den tuyen</text>
  <rect x="50" y="210" width="130" height="34" rx="6" fill="#3B82F6"/>
  <text x="115" y="232" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xem chi tiet</text>
  <rect x="196" y="210" width="90" height="34" rx="6" fill="#EF4444"/>
  <text x="241" y="232" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Xoa</text>

  <!-- GOOD -->
  <text x="440" y="66" font-size="14" font-weight="700" fill="#047857">OK Nen #121212, card sang hon, chu #E0E0E0, brand giam saturation</text>
  <rect x="440" y="78" width="390" height="180" rx="8" fill="#121212"/>
  <text x="460" y="110" font-size="16" font-weight="700" fill="#E0E0E0">Doanh thu thang 8</text>
  <rect x="460" y="126" width="350" height="70" rx="6" fill="#1E1E1E"/>
  <text x="476" y="152" font-size="13" fill="#E0E0E0">Card sang hon nen = "noi len tren"</text>
  <text x="476" y="176" font-size="12" fill="#A0A0A0">nang do cao bang do sang, khong bang shadow</text>
  <rect x="460" y="210" width="130" height="34" rx="6" fill="#8AB4F8"/>
  <text x="525" y="232" font-size="13" font-weight="600" fill="#0B1220" text-anchor="middle">Xem chi tiet</text>
  <rect x="606" y="210" width="90" height="34" rx="6" fill="#F28B82"/>
  <text x="651" y="232" font-size="13" font-weight="600" fill="#2A0E0E" text-anchor="middle">Xoa</text>

  <line x1="30" y1="284" x2="830" y2="284" stroke="#e5e7eb"/>
  <text x="30" y="310" font-size="13" font-weight="700" fill="#374151">Bang do cao (elevation) trong dark mode = do sang be mat</text>
  <rect x="30" y="322" width="120" height="46" fill="#121212"/>
  <text x="90" y="350" font-size="11" fill="#9CA3AF" text-anchor="middle">#121212 nen</text>
  <rect x="158" y="322" width="120" height="46" fill="#1E1E1E"/>
  <text x="218" y="350" font-size="11" fill="#B0B0B0" text-anchor="middle">#1E1E1E card</text>
  <rect x="286" y="322" width="120" height="46" fill="#2C2C2C"/>
  <text x="346" y="350" font-size="11" fill="#C8C8C8" text-anchor="middle">#2C2C2C modal</text>
  <text x="430" y="340" font-size="12" fill="#6b7280">Cang "noi" len tren thi cang sang mot chut.</text>
  <text x="430" y="360" font-size="12" fill="#6b7280">WCAG van ap dung — phai kiem tuong phan lai tu dau cho ca hai theme.</text>
</svg>
