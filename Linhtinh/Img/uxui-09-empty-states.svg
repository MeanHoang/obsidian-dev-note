<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#111827">Empty State — bien man hinh trong thanh diem onboarding</text>

  <!-- bad -->
  <rect x="30" y="56" width="380" height="176" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="30" y="56" width="380" height="30" rx="12" fill="#fef2f2"/>
  <rect x="30" y="74" width="380" height="12" fill="#fef2f2"/>
  <text x="46" y="77" font-size="12.5" font-weight="700" fill="#b91c1c">❌ Man hinh trang tron</text>
  <text x="220" y="152" font-size="14" fill="#9ca3af" text-anchor="middle">No data</text>
  <text x="220" y="216" font-size="11.5" fill="#991b1b" text-anchor="middle">Nguoi dung khong biet lam gi tiep</text>

  <!-- good -->
  <rect x="450" y="56" width="380" height="176" rx="12" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <rect x="450" y="56" width="380" height="30" rx="12" fill="#f0fdf4"/>
  <rect x="450" y="74" width="380" height="12" fill="#f0fdf4"/>
  <text x="466" y="77" font-size="12.5" font-weight="700" fill="#15803d">✅ Empty state co huong dan</text>

  <rect x="608" y="100" width="64" height="46" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <path d="M622 138 l14 -18 l10 12 l8 -9 l12 15 z" fill="#a5b4fc"/>
  <circle cx="626" cy="114" r="5" fill="#a5b4fc"/>

  <text x="640" y="170" font-size="13.5" font-weight="700" fill="#111827" text-anchor="middle">Chua co project nao</text>
  <text x="640" y="190" font-size="11.5" fill="#6b7280" text-anchor="middle">Khu vuc nay de gom cong viec cua team ban</text>
  <rect x="556" y="200" width="168" height="24" rx="6" fill="#4f46e5"/>
  <text x="640" y="216" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">+ Tao project dau tien</text>

  <!-- 3 types -->
  <text x="30" y="270" font-size="14" font-weight="700" fill="#111827">Ba loai empty state — thong diep khac nhau</text>

  <rect x="30" y="284" width="260" height="96" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="48" y="310" font-size="12.5" font-weight="700" fill="#3730a3">First-use</text>
  <text x="48" y="332" font-size="11.5" fill="#4338ca">Lan dau, chua co gi</text>
  <text x="48" y="352" font-size="11.5" fill="#4338ca">→ dip de onboard:</text>
  <text x="48" y="370" font-size="11.5" fill="#4338ca">giai thich + CTA + template</text>

  <rect x="300" y="284" width="260" height="96" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="318" y="310" font-size="12.5" font-weight="700" fill="#15803d">User-cleared</text>
  <text x="318" y="332" font-size="11.5" fill="#166534">Da xong het viec</text>
  <text x="318" y="352" font-size="11.5" fill="#166534">(vd: inbox zero)</text>
  <text x="318" y="370" font-size="11.5" fill="#166534">→ dip de khen / dong vien</text>

  <rect x="570" y="284" width="260" height="96" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="588" y="310" font-size="12.5" font-weight="700" fill="#b45309">No results / error</text>
  <text x="588" y="332" font-size="11.5" fill="#92400e">Tim khong ra hoac loi tai</text>
  <text x="588" y="352" font-size="11.5" fill="#92400e">→ noi ro ly do</text>
  <text x="588" y="370" font-size="11.5" fill="#92400e">va cach xu ly</text>
</svg>
