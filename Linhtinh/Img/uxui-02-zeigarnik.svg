<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Zeigarnik Effect: viec dang do thoi thuc nguoi dung hoan tat</text>

  <g transform="translate(20,58)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#b91c1c">✗ Khong cho biet con gi</text>
    <rect x="0" y="12" width="360" height="200" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="20" y="46" font-size="14" fill="#374151" font-weight="600">Ho so cua ban</text>
    <g font-size="12" fill="#6b7280">
      <text x="20" y="78">Ten: Hoang</text>
      <text x="20" y="102">Email: ...</text>
      <text x="20" y="126">Cua hang: (trong)</text>
    </g>
    <text x="20" y="176" font-size="12" fill="#b91c1c">User khong thay "vong lap con ho"</text>
    <text x="20" y="196" font-size="12" fill="#b91c1c">→ khong co dong luc quay lai</text>
  </g>

  <g transform="translate(450,58)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#047857">✓ Progress bar + checklist</text>
    <rect x="0" y="12" width="360" height="200" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="20" y="46" font-size="14" fill="#374151" font-weight="600">Ho so hoan thanh 60%</text>
    <rect x="20" y="56" width="320" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="20" y="56" width="192" height="12" rx="6" fill="#16a34a"/>

    <g font-size="12">
      <circle cx="28" cy="94" r="8" fill="#16a34a"/><text x="28" y="98" fill="#fff" font-size="10" text-anchor="middle">✓</text>
      <text x="46" y="98" fill="#9ca3af">Tao tai khoan</text>
      <circle cx="28" cy="122" r="8" fill="#16a34a"/><text x="28" y="126" fill="#fff" font-size="10" text-anchor="middle">✓</text>
      <text x="46" y="126" fill="#9ca3af">Ket noi cua hang</text>
      <circle cx="28" cy="150" r="8" fill="#ffffff" stroke="#9ca3af"/>
      <text x="46" y="154" fill="#111827" font-weight="600">Cai dat chuong trinh diem</text>
      <circle cx="28" cy="178" r="8" fill="#ffffff" stroke="#9ca3af"/>
      <text x="46" y="182" fill="#111827" font-weight="600">Bat widget tren storefront</text>
    </g>
    <rect x="185" y="26" width="155" height="22" rx="11" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="262" y="41" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Con 2 buoc de kich hoat</text>
  </g>
