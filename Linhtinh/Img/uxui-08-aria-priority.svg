<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#111827">"No ARIA is better than bad ARIA" - thu tu uu tien</text>

  <rect x="30" y="60" width="800" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <circle cx="66" cy="91" r="18" fill="#10b981"/>
  <text x="66" y="97" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="98" y="86" font-size="15" font-weight="700" fill="#047857">Dung HTML chuan truoc</text>
  <text x="98" y="108" font-size="13" fill="#065f46">Neu dung duoc button / nav / label thi DUNG dung toi ARIA - chung accessible san.</text>

  <rect x="30" y="134" width="800" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="66" cy="165" r="18" fill="#f59e0b"/>
  <text x="66" y="171" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="98" y="160" font-size="15" font-weight="700" fill="#b45309">Chi khi HTML khong du dien dat</text>
  <text x="98" y="182" font-size="13" fill="#92400e">Tab tu che, dropdown phuc tap, slider tuy bien -&gt; theo dung ARIA Authoring Practices.</text>

  <rect x="30" y="208" width="800" height="62" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="66" cy="239" r="18" fill="#3b82f6"/>
  <text x="66" y="245" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="98" y="234" font-size="15" font-weight="700" fill="#1d4ed8">ARIA phai di kem xu ly ban phim tu viet</text>
  <text x="98" y="256" font-size="13" fill="#1e3a8a">Them role thoi chua du - phai cho Tab va phim mui ten chay dung.</text>

  <rect x="30" y="282" width="390" height="36" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="305" font-size="12.5" fill="#b91c1c">X  role="button" tren div -&gt; van thieu phim &amp; focus</text>

  <rect x="440" y="282" width="390" height="36" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="456" y="305" font-size="12.5" fill="#b91c1c">X  role="navigation" tren &lt;nav&gt; -&gt; du thua, gay nhieu</text>
</svg>
