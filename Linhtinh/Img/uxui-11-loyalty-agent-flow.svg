<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Luong mua qua agent — loyalty rot o dau, con bam duoc o dau</text>

  <!-- step 1 -->
  <rect x="20" y="56" width="190" height="86" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="115" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#111827">1. User hoi agent</text>
  <text x="115" y="104" text-anchor="middle" font-size="11.5" fill="#4b5563">"mua cho toi ao thun</text>
  <text x="115" y="122" text-anchor="middle" font-size="11.5" fill="#4b5563">cua shop X"</text>

  <path d="M210 99 L246 99" stroke="#9ca3af" stroke-width="2"/>
  <path d="M246 99 l-9 -5 v10 z" fill="#9ca3af"/>

  <!-- step 2 -->
  <rect x="250" y="56" width="230" height="86" rx="10" fill="#eef4fd" stroke="#a9c4ea" stroke-width="1.5"/>
  <text x="365" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a4d8f">2. Agent tim san pham</text>
  <text x="365" y="104" text-anchor="middle" font-size="11.5" fill="#374151">Catalog API + Cart MCP</text>
  <text x="365" y="124" text-anchor="middle" font-size="11.5" fill="#374151">(create_cart / update_cart)</text>

  <path d="M480 99 L516 99" stroke="#9ca3af" stroke-width="2"/>
  <path d="M516 99 l-9 -5 v10 z" fill="#9ca3af"/>

  <!-- step 3 -->
  <rect x="520" y="56" width="180" height="86" rx="10" fill="#fff8ec" stroke="#e8c99a" stroke-width="1.5"/>
  <text x="610" y="82" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">3. continue_url</text>
  <text x="610" y="104" text-anchor="middle" font-size="11.5" fill="#374151">agent ban giao buyer</text>
  <text x="610" y="124" text-anchor="middle" font-size="11.5" fill="#374151">ve storefront merchant</text>

  <path d="M700 99 L736 99" stroke="#9ca3af" stroke-width="2"/>
  <path d="M736 99 l-9 -5 v10 z" fill="#9ca3af"/>

  <!-- step 4 -->
  <rect x="740" y="56" width="100" height="86" rx="10" fill="#f1f9f4" stroke="#a8d5b9" stroke-width="1.5"/>
  <text x="790" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1e7e45">4. Checkout</text>
  <text x="790" y="108" text-anchor="middle" font-size="11.5" fill="#374151">tren storefront</text>
  <text x="790" y="126" text-anchor="middle" font-size="11.5" fill="#374151">merchant</text>

  <!-- annotations -->
  <path d="M365 142 L365 176" stroke="#d93025" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="230" y="176" width="270" height="112" rx="8" fill="#fdf3f2" stroke="#e8b4ae" stroke-width="1.5"/>
  <text x="248" y="200" font-size="13" font-weight="700" fill="#b3261e">&#10007; Loyalty khong bam vao duoc</text>
  <text x="248" y="222" font-size="11.5" fill="#374151">object cart chi co: line_items, context,</text>
  <text x="248" y="240" font-size="11.5" fill="#374151">attribution, buyer, signals</text>
  <text x="248" y="262" font-size="11.5" font-weight="600" fill="#b3261e">Khong co field discount code, gift card,</text>
  <text x="248" y="280" font-size="11.5" font-weight="600" fill="#b3261e">cart attributes hay note.</text>

  <path d="M790 142 L790 176" stroke="#1e7e45" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="540" y="176" width="300" height="112" rx="8" fill="#f1f9f4" stroke="#a8d5b9" stroke-width="1.5"/>
  <text x="558" y="200" font-size="13" font-weight="700" fill="#1e7e45">&#10003; Cho loyalty con bam duoc</text>
  <text x="558" y="222" font-size="11.5" fill="#374151">Checkout van chay tren storefront merchant,</text>
  <text x="558" y="240" font-size="11.5" fill="#374151">don ve Shopify admin nhu sales channel khac.</text>
  <text x="558" y="262" font-size="11.5" font-weight="600" fill="#1e7e45">Duong ap discount duy nhat tim duoc:</text>
  <text x="558" y="280" font-size="11.5" font-weight="600" fill="#1e7e45">cart permalink — query param tren checkout URL.</text>

  <rect x="20" y="308" width="820" height="66" rx="8" fill="#f8f9fb" stroke="#e2e5ea"/>
  <text x="38" y="330" font-size="12" font-weight="700" fill="#374151">Khoang trong chua ai lap:</text>
  <text x="38" y="350" font-size="11.5" fill="#4b5563">diem thuong / tier / reward hien thi the nao trong luong agent — khong co tai lieu Shopify hay UCP nao mo ta.</text>
  <text x="38" y="368" font-size="11.5" fill="#4b5563">Nhung UCP dung reverse-domain namespace, va vi du chinh thuc la com.loyaltyprovider.* — spec CO chua cho.</text>
</svg>
