<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">Proximity: khoang cach TRONG nhom &lt; khoang cach GIUA cac nhom</text>

  <!-- LEFT: bad -->
  <text x="30" y="70" font-size="14" font-weight="700" fill="#b91c1c">Truoc — moi thu cach deu tam tap</text>
  <rect x="30" y="84" width="370" height="260" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <circle cx="76" cy="130" r="22" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="66" y="136" font-size="13" fill="#6b7280">av</text>

  <rect x="112" y="118" width="150" height="14" rx="4" fill="#9ca3af"/>
