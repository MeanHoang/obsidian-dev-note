  <line x1="770" y1="132" x2="770" y2="140" stroke="#15803d" stroke-width="2"/>
  <text x="778" y="140" font-size="11" fill="#15803d">8</text>
  <line x1="770" y1="162" x2="770" y2="214" stroke="#15803d" stroke-width="2"/>
  <text x="778" y="192" font-size="11" fill="#15803d">32</text>
  <text x="482" y="322" font-size="12" fill="#15803d">Hai cum ro rang: danh tinh / hanh dong.</text>
