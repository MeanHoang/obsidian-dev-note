  <rect x="112" y="192" width="110" height="30" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="130" y="212" font-size="12" fill="#374151">Chinh sua</text>

  <!-- equal gap markers -->
  <line x1="340" y1="132" x2="340" y2="162" stroke="#dc2626" stroke-width="2"/>
  <text x="348" y="152" font-size="11" fill="#dc2626">16</text>
  <line x1="340" y1="168" x2="340" y2="198" stroke="#dc2626" stroke-width="2"/>
  <text x="348" y="188" font-size="11" fill="#dc2626">16</text>
  <text x="52" y="322" font-size="12" fill="#b91c1c">Mat khong biet cai gi thuoc cai gi — nhin nhu mot dong.</text>

  <!-- RIGHT: good -->
  <text x="460" y="70" font-size="14" font-weight="700" fill="#15803d">Sau — nhom lai bang khoang cach</text>
  <rect x="460" y="84" width="370" height="260" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="506" cy="130" r="22" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="496" y="136" font-size="13" fill="#6b7280">av</text>

  <rect x="542" y="118" width="150" height="14" rx="4" fill="#374151"/>
