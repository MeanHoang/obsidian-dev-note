  <rect x="536" y="108" width="216" height="54" rx="7" fill="none" stroke="#22c55e" stroke-dasharray="4 3"/>
  <text x="536" y="102" font-size="11" fill="#15803d">nhom "danh tinh" — gap 8</text>

  <rect x="542" y="214" width="110" height="32" rx="6" fill="#16a34a"/>
