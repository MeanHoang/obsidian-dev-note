<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#111827">Jakob's Law: nguoi dung mong san pham cua ban giong cai ho da quen</text>

  <!-- convention -->
  <g transform="translate(20,60)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#047857">✓ Theo quy uoc quen thuoc</text>
    <rect x="0" y="12" width="390" height="230" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="0" y="12" width="390" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <circle cx="26" cy="34" r="11" fill="#2563eb"/>
    <text x="26" y="38" font-size="11" fill="#ffffff" text-anchor="middle">L</text>
    <text x="46" y="38" font-size="12" fill="#374151">Logo (ve trang chu)</text>
    <text x="300" y="38" font-size="16" fill="#374151">🔍</text>
    <text x="330" y="38" font-size="16" fill="#374151">🛒</text>
    <text x="360" y="38" font-size="16" fill="#374151">⚙</text>
    <g font-size="12" fill="#6b7280">
      <text x="20" y="86">Trai-tren = logo · Phai-tren = gio hang / settings</text>
      <text x="20" y="112">Search co icon kinh lup</text>
      <text x="20" y="138">Banh rang = cai dat</text>
    </g>
    <rect x="20" y="164" width="350" height="60" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="195" y="199" font-size="13" fill="#047857" text-anchor="middle">Khong phai hoc lai → dung duoc ngay</text>
  </g>

  <!-- broken convention -->
  <g transform="translate(450,60)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#b91c1c">✗ "Sang tao" pha quy uoc</text>
    <rect x="0" y="12" width="390" height="230" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="0" y="12" width="390" height="44" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="20" y="38" font-size="16" fill="#374151">⚙</text>
    <text x="50" y="38" font-size="16" fill="#374151">🛒</text>
    <circle cx="364" cy="34" r="11" fill="#9ca3af"/>
    <text x="364" y="38" font-size="11" fill="#ffffff" text-anchor="middle">L</text>
    <g font-size="12" fill="#6b7280">
      <text x="20" y="86">Logo bi day sang phai</text>
      <text x="20" y="112">Gio hang nam ben trai</text>
      <text x="20" y="138">Icon tu che thay cho icon chuan</text>
    </g>
    <rect x="20" y="164" width="350" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="195" y="192" font-size="13" fill="#b91c1c" text-anchor="middle">Mental model bi pha →</text>
    <text x="195" y="212" font-size="13" fill="#b91c1c" text-anchor="middle">user phai hoc lai, de bo di</text>
  </g>
</svg>
