<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="700" fill="#111827">Mot mau = MOT THANG 50-900, khong phai 1 gia tri</text>

  <text x="30" y="66" font-size="13" font-weight="700" fill="#374151">Thang do (red)</text>
  <g>
    <rect x="30" y="76" width="88" height="52" fill="#FEF2F2" stroke="#e5e7eb"/>
    <rect x="118" y="76" width="88" height="52" fill="#FEE2E2" stroke="#e5e7eb"/>
    <rect x="206" y="76" width="88" height="52" fill="#FECACA" stroke="#e5e7eb"/>
    <rect x="294" y="76" width="88" height="52" fill="#FCA5A5"/>
