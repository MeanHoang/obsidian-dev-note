  <rect x="44" y="84" width="346" height="70" rx="8" fill="#ffffff" stroke="#e5c9c9"/>
  <text x="60" y="106" font-size="14" fill="#111">Don hang #1204 da duoc thanh toan</text>
  <text x="60" y="126" font-size="14" fill="#111">Khach da tra 1.250.000d qua the tin dung</text>
  <text x="60" y="146" font-size="14" fill="#111">2 gio truoc</text>

