<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công ty AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6;--surface:#fffdf8;--surface-2:#f8f4ec;--surface-3:#efe9dd;
  --border:#e2dbcd;--border-strong:#cfc6b4;
  --text:#1f1d1a;--muted:#6d675d;--faint:#9a9386;
  --accent:#2f6f5e;--accent-ink:#fff;--accent-soft:#e1efe8;
  --ok:#2f8a4f;--ok-soft:#e1f2e6;--warn:#b97c08;--warn-soft:#fbefd2;
  --danger:#c0442f;--danger-soft:#f9e0da;--info:#3b6fb6;--info-soft:#e2ebf7;
  --floor:#ece6d9;--floor-line:#e2dacb;--desk:#d9c7a7;--desk-edge:#bfa982;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --shadow-lg:0 10px 40px rgba(30,20,0,.18);
  --radius:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16171a;--surface:#1e2024;--surface-2:#24262b;--surface-3:#2b2e34;
    --border:#33363d;--border-strong:#454952;--text:#ecebe7;--muted:#a3a19b;--faint:#77756f;
    --accent:#5fb89c;--accent-ink:#0f1a16;--accent-soft:#1f3a31;
    --ok:#5fc07f;--ok-soft:#1f3527;--warn:#e3a93a;--warn-soft:#3a2f17;
    --danger:#ec7a64;--danger-soft:#3d221d;--info:#7aa7e6;--info-soft:#1f2c3f;
    --floor:#23252a;--floor-line:#2c2f35;--desk:#4a4339;--desk-edge:#5b5245;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a;--surface:#1e2024;--surface-2:#24262b;--surface-3:#2b2e34;
  --border:#33363d;--border-strong:#454952;--text:#ecebe7;--muted:#a3a19b;--faint:#77756f;
  --accent:#5fb89c;--accent-ink:#0f1a16;--accent-soft:#1f3a31;
  --ok:#5fc07f;--ok-soft:#1f3527;--warn:#e3a93a;--warn-soft:#3a2f17;
  --danger:#ec7a64;--danger-soft:#3d221d;--info:#7aa7e6;--info-soft:#1f2c3f;
  --floor:#23252a;--floor-line:#2c2f35;--desk:#4a4339;--desk-edge:#5b5245;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--shadow-lg:0 10px 40px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:12px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;position:relative}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav.active{background:var(--accent-soft);color:var(--accent)}
.nav .ico{width:20px;text-align:center}
.nav .count{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.side-foot .row{display:flex;justify-content:space-between;margin:3px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;font-weight:700}
.topbar .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{border:1px solid var(--border-strong);background:var(--surface);padding:7px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.6;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--surface)}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:18px}
.view{display:none}.view.on{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-weight:500}
.stat.warnish{border-color:var(--warn);background:var(--warn-soft)}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.w>i{background:var(--warn)}.bar.d>i{background:var(--danger)}
.hq{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 16px;align-items:center;position:relative;overflow:hidden}
.hq::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,var(--floor-line) 46px 47px),repeating-linear-gradient(0deg,transparent 0 46px,var(--floor-line) 46px 47px);opacity:.35;pointer-events:none}
.hq>*{position:relative}
.hq-title{font-weight:700;display:flex;align-items:center;gap:8px}
.hq-title small{color:var(--muted);font-weight:400}
.hq-desks{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.hq-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chipf{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chipf.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.chipf b{font-weight:600;margin-left:4px}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.room{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.room:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.room.waiting{border-color:var(--warn);animation:pulseWarn 2s infinite}
.room.error{border-color:var(--danger)}
.room.new{animation:popIn .6s ease-out}
@keyframes pulseWarn{0%,100%{box-shadow:0 0 0 0 rgba(201,138,18,.35),var(--shadow)}50%{box-shadow:0 0 0 6px rgba(201,138,18,0),var(--shadow)}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.room-head{padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--border)}
.room-head .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.room-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-working{background:var(--info-soft);color:var(--info)}
.b-waiting{background:var(--warn-soft);color:var(--warn)}
.b-error,.b-fail{background:var(--danger-soft);color:var(--danger)}
.b-done,.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-muted{background:var(--surface-3);color:var(--muted)}
.b-flow{background:var(--surface-3);color:var(--text);font-family:"JetBrains Mono",monospace;font-weight:500}
.b-auto{background:var(--accent-soft);color:var(--accent)}
.room-floor{background:var(--floor);background-image:repeating-linear-gradient(90deg,transparent 0 38px,var(--floor-line) 38px 39px),repeating-linear-gradient(0deg,transparent 0 38px,var(--floor-line) 38px 39px);padding:26px 8px 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px 4px}
.room-foot{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.room-foot .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.gate-ribbon{position:absolute;top:10px;right:10px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;box-shadow:var(--shadow);z-index:5;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-ribbon{background:var(--danger)}
/* Desk with anime character */
.desk{display:flex;flex-direction:column;align-items:center;position:relative;border-radius:12px;padding-top:2px;transition:background .15s}
.desk:hover{background:rgba(255,255,255,.35)}
:root[data-theme="dark"] .desk:hover{background:rgba(255,255,255,.05)}
.seat{position:relative;width:64px;height:64px;margin-bottom:-9px;z-index:1}
.seat svg{display:block;width:64px;height:64px}
.desk.working .seat{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.desk.idle .seat{opacity:.75;filter:saturate(.6)}
.desk-top{width:96px;height:18px;background:var(--desk);border-bottom:5px solid var(--desk-edge);border-radius:6px;position:relative;z-index:2;box-shadow:0 3px 6px rgba(0,0,0,.08)}
.laptop{position:absolute;right:3px;top:-12px;width:20px;height:13px;border-radius:3px 3px 1px 1px;background:#8d939c;border:1.5px solid #6c727b}
.laptop::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:4px;border-radius:50%;background:#c8ccd2;transform:translateX(-50%)}
.desk.working .laptop::after{background:#9ff0d4;box-shadow:0 0 6px #6fe3bd}
.mug{position:absolute;left:5px;top:-7px;width:8px;height:9px;border-radius:0 0 3px 3px;background:#f1efe9;border:1.5px solid #c9c2b4}
.status-pin{position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;border:2px solid var(--floor);z-index:3}
.desk.working .status-pin{background:var(--info)}
.desk.waiting .status-pin{background:var(--warn);animation:blink 1s infinite}
.desk.error .status-pin{background:var(--danger)}
.desk.done .status-pin{background:var(--ok)}
.desk.idle .status-pin{background:var(--faint)}
@keyframes blink{50%{opacity:.25}}
.bubble{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:0 7px;font-size:11px;white-space:nowrap;z-index:4;box-shadow:var(--shadow);line-height:18px}
.typing span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--muted);margin:0 1px;animation:ty 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.zz{position:absolute;right:-2px;top:-6px;font-size:11px;color:var(--faint);font-weight:700;z-index:4;animation:zz 2.4s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}50%{opacity:1}100%{opacity:0;transform:translate(4px,-6px)}}
.nameplate{margin-top:7px;font-size:11px;font-weight:600;background:var(--surface);border-radius:99px;padding:1px 8px;border:1px solid var(--border);display:flex;align-items:center;gap:4px;white-space:nowrap}
.nameplate i{width:7px;height:7px;border-radius:50%;background:var(--role);display:inline-block}
.model-tag{font-size:10px;color:var(--muted);margin-top:1px;font-family:"JetBrains Mono",monospace;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.doc-count{font-size:10px;color:var(--muted)}
.tip{position:fixed;z-index:100;background:var(--text);color:var(--surface);padding:8px 10px;border-radius:10px;font-size:12px;max-width:260px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:var(--shadow-lg)}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:2px}
.drawer{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .25s;z-index:60;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.drawer-body{overflow:auto;padding:8px 16px 20px;flex:1}
.feed-item{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border)}
.av{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--role) 22%,var(--surface));display:grid;place-items:end center;overflow:hidden;flex:none;border:1px solid color-mix(in srgb,var(--role) 40%,transparent)}
.av svg{width:100%;height:100%;display:block}
.av.lg{width:42px;height:42px;border-radius:12px}
.feed-item .t{font-size:13px}
.feed-item .m{font-size:11px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600;flex-wrap:wrap}
.panel-b{padding:14px 16px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.crumb button{border:0;background:none;color:var(--accent);padding:0}
.rd-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rd-head h2{margin:0;font-size:20px}
.rd-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.rd-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stepper{display:flex;overflow-x:auto;padding:4px 2px}
.step{flex:1;min-width:88px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:12px;color:var(--muted);text-align:center}
.step::before{content:"";position:absolute;top:12px;left:-50%;right:50%;height:3px;background:var(--surface-3);z-index:0}
.step:first-child::before{display:none}
.step .c{width:26px;height:26px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;z-index:1}
.step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done::before,.step.cur::before{background:var(--ok)}
.step.cur .c{border-color:var(--info);color:var(--info);box-shadow:0 0 0 4px var(--info-soft)}
.step.cur.wait .c{border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.step.cur.err .c{border-color:var(--danger);color:var(--danger);box-shadow:0 0 0 4px var(--danger-soft)}
.step.cur{color:var(--text);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tab{border:0;background:none;padding:11px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px 32px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--border)}
.tl .time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;padding-top:6px}
.tl .what{font-size:13px}
.tl .what code,.doc-body code,.gate code{background:var(--surface-3);padding:0 5px;border-radius:5px}
.tl .ev{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.tl .cost{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:6px}
/* Gate */
.gate{border:2px solid var(--warn);background:var(--warn-soft);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gate.err{border-color:var(--danger);background:var(--danger-soft)}
.gate h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gate .ctx{font-size:13px}
.gate-cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.gate .opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border-strong);border-radius:10px;padding:9px 11px;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .key{width:24px;height:24px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.opt.rec{border-color:var(--accent)}
.opt.rec .key{background:var(--accent);color:var(--accent-ink)}
.opt small{display:block;color:var(--muted);font-size:12px}
.rec-line{font-size:12px;color:var(--muted)}
.rec-line b{color:var(--accent)}
.gate textarea{width:100%;border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;font:inherit;background:var(--surface);color:var(--text);resize:vertical;min-height:44px}
.flow-steps{font-size:12px;background:var(--surface);border-radius:10px;padding:8px 10px;border:1px dashed var(--border-strong)}
.flow-steps ol{margin:0;padding-left:18px}
.read-first{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.read-first button{border:1px solid var(--border-strong);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px}
.read-first button:hover{border-color:var(--accent);color:var(--accent)}
.no-gate{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:14px;color:var(--muted);text-align:center;font-size:13px}
/* Dossier */
.dossier{display:grid;grid-template-columns:210px 290px minmax(0,1fr);min-height:620px}
.dos-col{border-right:1px solid var(--border);min-width:0;display:flex;flex-direction:column}
.dos-col:last-child{border-right:0}
.dos-h{padding:10px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:42px}
.dept{display:flex;gap:10px;align-items:center;padding:9px 12px;border:0;background:none;text-align:left;width:100%;border-left:3px solid transparent}
.dept:hover{background:var(--surface-2)}
.dept.on{background:var(--surface-2);border-left-color:var(--role)}
.dept .n{font-weight:600;font-size:13px}
.dept .s{font-size:11px;color:var(--muted)}
.dept .cnt{margin-left:auto;font-size:11px;background:var(--surface-3);border-radius:99px;padding:0 7px;font-weight:600}
.dept .cnt.new{background:var(--info);color:#fff}
.doclist{overflow:auto;flex:1}
.grp{padding:10px 14px 4px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.doc{display:flex;gap:10px;padding:10px 14px;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--border);align-items:flex-start}
.doc:hover{background:var(--surface-2)}
.doc.on{background:var(--accent-soft)}
.doc.pending{opacity:.5}
.doc .ic{font-size:18px;line-height:1.2;flex:none;width:22px;text-align:center}

function md(src){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  let out='',list=null,table=false,code=false;
  const closeList=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const raw of src.split('\n')){
    const l=raw.replace(/\s+$/,'');
    if(/^```/.test(l)){if(code){out+='</pre>';code=false;}else{closeList();out+='<pre class="term">';code=true;}continue;}
    if(code){out+=esc(l)+'\n';continue;}
    if(/^\|/.test(l)){const cells=l.split('|').slice(1,-1).map(c=>c.trim());if(cells.every(c=>/^-+$/.test(c)))continue;
      if(!table){closeList();out+='<table><tr>'+cells.map(c=>`<th>${inline(c)}</th>`).join('')+'</tr>';table=true;continue;}
      out+='<tr>'+cells.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>';continue;}
    if(table){out+='</table>';table=false;}
    let m;
    if(m=l.match(/^(#{1,4}) (.*)/)){closeList();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;continue;}
    if(m=l.match(/^- \[([ x])\] (.*)/)){if(list!=='ul'){closeList();out+='<ul>';list='ul';}out+=`<li class="chk">${m[1]==='x'?'☑️':'⬜'} ${inline(m[2])}</li>`;continue;}
    if(m=l.match(/^- (.*)/)){if(list!=='ul'){closeList();out+='<ul>';list='ul';}out+=`<li>${inline(m[1])}</li>`;continue;}
    if(m=l.match(/^(\d+)\. (.*)/)){if(list!=='ol'){closeList();out+='<ol>';list='ol';}out+=`<li value="${m[1]}">${inline(m[2])}</li>`;continue;}
    if(m=l.match(/^> (.*)/)){closeList();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue;}
    if(l==='---'){closeList();out+='<hr>';continue;}
    if(!l){closeList();continue;}
    closeList();out+=`<p>${inline(l)}</p>`;
  }
  closeList();if(table)out+='</table>';if(code)out+='</pre>';
  return out;
}

const fmtTok=k=>k>=1000?(k/1000).toFixed(1).replace('.0','').replace('.',',')+'M':Math.round(k)+'k';
const totTok=r=>Object.values(r.tok).reduce((a,b)=>a+b,0);
const evTok=c=>c?fmtTok(c*95):'—';
function tokBar(r){const t=totTok(r)||1;return `<div class="tokbar" title="Token theo role">${rolesOf(r).filter(k=>r.tok[k]).map(k=>`<i style="width:${r.tok[k]/t*100}%;background:${ROLES[k].color}" title="${ROLES[k].name}: ${fmtTok(r.tok[k])}"></i>`).join('')}</div>`;}
function statusBadge(s){return `<span class="badge b-${s}">${ROOM_STATUS_VN[s]}</span>`;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}
const vis=()=>rooms.filter(r=>proj==='all'||r.proj===proj);
const gateRooms=()=>vis().filter(r=>r.gate);
function deskHTML(role,state,model,task,roomId,docs,tok){
  const bubble=state==='working'?`<div class="bubble typing"><span></span><span></span><span></span></div>`:state==='waiting'?`<div class="bubble">🚦 chờ anh</div>`:state==='error'?`<div class="bubble">⚠️ lỗi</div>`:state==='done'?`<div class="bubble">✓</div>`:'';
  return `<div class="desk ${state}" data-desk-role="${role}" data-desk-room="${roomId||''}" data-tip-role="${role}" data-tip-state="${state}" data-tip-model="${esc(model||'')}" data-tip-task="${esc(task||'')}" data-tip-docs="${docs??''}">
    ${bubble}${state==='idle'?'<span class="zz">z</span>':''}
    <div class="seat">${avatarSVG(role,state)}<span class="status-pin"></span></div>
    <div class="desk-top"><div class="mug"></div><div class="laptop"></div></div>
    <div class="nameplate" style="--role:${ROLES[role].color}"><i></i>${ROLES[role].name}</div>
    ${model?`<div class="model-tag">${esc(model.replace('claude · ',''))}${tok!==undefined?' · '+(tok?fmtTok(tok):'0')+' tok':''}</div>`:''}
    ${docs!==undefined?`<div class="doc-count">📁 ${docs} hồ sơ</div>`:''}
  </div>`;
}

function hqSend(text){
  text=text.trim();if(!text)return;
  HQ_CHAT.msgs.push({who:'me',t:esc(text),at:Date.now()});renderHQView();
  setTimeout(()=>{
    let rep=`Em nhận rồi: “${esc(text)}”. Em xử lý và báo lại ở đây.`;
    if(/sao rồi/i.test(text)){const g=rooms.filter(r=>r.gate);rep=`Hiện có <b>${rooms.length}</b> việc ở ${Object.keys(PROJECTS).length} phòng ban. Chờ anh: ${g.map(r=>`${DL(r.id,(r.gate.read||['progress'])[0],PROJECTS[r.proj].icon+' '+esc(r.title))}`).join('')}`;}
    else if(/phòng ban mới/i.test(text)){
      if(PROJECTS.devnote){rep='Phòng <b>Nội dung</b> đã có rồi anh.';}
      else{PROJECTS.devnote=DEPT_RESERVE.devnote;RESERVE_ROOMS.forEach(r=>rooms.push(r));
        rep=`Em đã dựng <b>📝 Phòng Nội dung</b> ở <code>~/obsidian/dev-note</code>:<br>1. Workflow riêng: Nghiên cứu → Viết → Duyệt → Đăng<br>2. Nhân viên: Researcher, Parent, Writer, Editor<br>3. Harness riêng của phòng: role card + thông tin dự án<br>4. Lịch trực: bản tin 6:30 mỗi sáng<br>Việc đầu tiên đang chờ anh duyệt bản nháp.<br><button class="doclink" data-dept-chip="devnote">🏢 Xem phòng ban mới</button>`;
        setTimeout(()=>{renderAll();if(window.Office3D)Office3D.focus('devnote');toast('🏗️ Đã mở phòng ban mới: <b>📝 Nội dung</b>');},300);}
    }
    else if(/standard/i.test(text)){rep=`Em đã soạn thay đổi cho role card <b>verifier</b>. Anh trả lời <b>ok</b> là em ghi vào harness.`;}
    else if(/mở việc/i.test(text)){rep=`Em đề xuất mở phòng ở tầng <b>Joy</b> với flow <code>/ship-fix</code>, branch <code>bugfix/redeem-popup-ios-keyboard</code>. Anh xác nhận thì em mở (theo G19: luôn hỏi trước).<br><button class="doclink" id="btnAssign">＋ Xem và xác nhận</button>`;}
    else if(/job/i.test(text)){SCHEDULE.push({id:'s'+(SCHEDULE.length+1),name:'Tổng kết tuần',cron:'0 17 * * 5',human:'17:00 thứ 6',proj:'all',on:false,last:'—',next:'Chờ anh bật'});rep='Em đã thêm job <b>Tổng kết tuần</b> (<code>0 17 * * 5</code>) vào Lịch trực ở trạng thái <b>tắt</b>. Anh bật lên là chạy.';}
    HQ_CHAT.msgs.push({who:'secretary',t:rep,at:Date.now()});
    if($('#view-hq').classList.contains('on'))renderHQView();else{HQ_CHAT.unread++;renderHQ();}
  },1000);
}

function renderFloor(){
  const order={waiting:0,error:1,working:2,done:3};
  const list=vis().filter(r=>filter==='all'||r.status===filter).sort((a,b)=>order[a.status]-order[b.status]);
  $('#floor').innerHTML=list.map(r=>{
    const docs=buildDocs(r);
    const desks=rolesOf(r).map(role=>deskHTML(role,r.bots[role],r.models[role],r.tasks[role],r.id,docs.filter(d=>d.role===role&&d.available).length,r.tok[role])).join('');
    const ribbon=r.status==='waiting'?`<div class="gate-ribbon">🚦 ${esc(r.gate.title)}</div>`:r.status==='error'?`<div class="gate-ribbon err-ribbon">⚠️ Cần anh xử lý</div>`:'';
    const nNew=docs.filter(d=>d.state==='new').length, nAv=docs.filter(d=>d.available).length;
    return `<article class="room ${r.status} ${r.isNew?'new':''}" data-room="${r.id}">${ribbon}
      <div class="room-head"><div class="l1">${statusBadge(r.status)}<span class="badge b-flow">${r.flow}</span>${r.mode==='auto'?'<span class="badge b-auto">AUTO</span>':''}${proj==='all'?`<span class="badge b-muted">${PROJECTS[r.proj].icon} ${PROJECTS[r.proj].name}</span>`:''}</div>
        <div class="room-title">${esc(r.title)}</div><div class="branch mono">⎇ ${esc(r.branch)}</div></div>
      <div class="room-floor">${desks}</div>
      <div class="room-foot">
        <div class="row"><span>${esc(r.phase.label)}</span><span>${stepsFor(r)[Math.min(r.stepIdx,stepsFor(r).length-1)]}</span></div>
        <div class="row"><span>📁 ${nAv} hồ sơ ${nNew?`· <b style="color:var(--info)">${nNew} mới</b>`:''}${CHAT[r.id]&&CHAT[r.id].unread?` · <b style="color:var(--accent)">💬 ${CHAT[r.id].unread}</b>`:''}</span><span class="mono">${fmtTok(totTok(r))} token</span></div>
        ${tokBar(r)}</div></article>`;
  }).join('')||`<div class="no-gate">Không có phòng nào ở trạng thái này.</div>`;
  rooms.forEach(r=>delete r.isNew);
}

/* ================= ROOM / DOSSIER ================= */
let currentRoom=null, roomTab='dossier', dept='all', groupBy='role', selDoc=null;
function pickDefaultDoc(r,docs){
  if(r.gate&&r.gate.read) {const d=docs.find(x=>x.id===r.gate.read[0]&&x.available);if(d)return d.id;}
  const av=docs.filter(d=>d.available&&d.step!==-1).sort((a,b)=>b.step-a.step);
  return (av[0]||docs[0]).id;
}
function openRoom(id,role){
  currentRoom=id;roomTab='dossier';dept=role||'all';
  const r=rooms.find(x=>x.id===id),docs=buildDocs(r);
  if(role){const d=docs.filter(x=>x.role===role&&x.available).sort((a,b)=>b.step-a.step)[0]||docs.find(x=>x.role===role);selDoc=d?d.id:null;}
  else selDoc=pickDefaultDoc(r,docs);
  show('room');
}
function renderRoom(){
  const r=rooms.find(x=>x.id===currentRoom);if(!r)return;
  const S=stepsFor(r),cur=Math.min(r.stepIdx,S.length-1),fin=r.status==='done';
  const stepper=S.map((s,i)=>{const done=i<cur||(fin&&i<S.length-1);const c=i===cur&&!fin;return `<div class="step ${done?'done':''} ${c?'cur':''} ${c&&r.status==='waiting'?'wait':''} ${c&&r.status==='error'?'err':''}"><div class="c">${done?'✓':i+1}</div>${s}</div>`;}).join('');
  $('#view-room').innerHTML=`
    <div class="crumb"><button data-back>← Văn phòng</button><span>/</span><span>${PROJECTS[r.proj].icon} Phòng ${esc(PROJECTS[r.proj].name)}</span><span>/</span><span class="mono">${esc(r.branch)}</span></div>
    <div class="rd-head"><div><h2>${esc(r.title)}</h2>
      <div class="rd-meta">${statusBadge(r.status)}<span class="badge b-flow">${r.flow}</span>${r.mode==='auto'?'<span class="badge b-auto">AUTO</span>':'<span class="badge b-muted">Có gate</span>'}
      <span class="muted mono" style="font-size:12px">~/joy-worktrees/${esc(slugOf(r))} · port ${3460+rooms.indexOf(r)} · ${fmtTok(totTok(r))} token</span></div></div>
      <div class="rd-actions"><button class="btn" data-act="orca">↗ Mở trong Orca</button><button class="btn" data-act="pause">⏸ Tạm dừng</button><button class="btn danger" data-act="stop">■ Dừng hẳn</button></div></div>
    <div class="panel"><div class="panel-b"><div class="stepper">${stepper}</div></div></div>
    ${r.gate?gateHTML(r,true):''}
    <div class="panel">
      <div class="tabs">${[['dossier','📁 Hồ sơ nhóm'],['chat',`💬 Chat với Parent${CHAT[r.id]&&CHAT[r.id].unread?' ('+CHAT[r.id].unread+')':''}`],['timeline','🕒 Timeline']].map(([k,l])=>`<button class="tab ${roomTab===k?'on':''}" data-rtab="${k}">${l}</button>`).join('')}
        <div class="spacer"></div><span class="muted" style="font-size:12px;align-self:center;padding-right:6px">📌 NOW: ${esc(r.gate?'Chờ anh — '+r.gate.title:r.phase.label)}</span></div>
      <div id="roomTabBody">${roomTabHTML(r)}</div>
    </div>`;
  mountViewer();
}
function gateHTML(r,inRoom){
  const g=r.gate,docs=buildDocs(r);
  const reads=(g.read||[]).map(id=>docs.find(d=>d.id===id)).filter(Boolean);
  return `<div class="gate ${g.kind==='park'?'err':''}" data-gate-room="${r.id}">
    <h3>🚦 ${esc(g.title)} ${inRoom?'':`<span class="muted" style="font-weight:400;font-size:12px">· ${esc(r.title)}</span>`}</h3>
    <div class="gate-cols"><div style="display:flex;flex-direction:column;gap:10px">
      <div class="ctx">${esc(g.context)}</div>
      ${g.flow?`<div class="flow-steps"><b>Luồng hiện tại:</b><ol>${g.flow.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
      ${reads.length?`<div class="read-first"><b>📖 Đọc trước khi quyết:</b>${reads.map(d=>`<button data-open-doc="${r.id}|${d.id}">${d.icon} ${esc(d.title)}</button>`).join('')}</div>`:''}
    </div><div style="display:flex;flex-direction:column;gap:8px">
      <div class="opts">${g.options.map(o=>`<button class="opt ${o.k===g.rec?'rec':''}" data-answer="${o.k}"><span class="key">${o.k}</span><span><b>${esc(o.l)}</b><small>${esc(o.d)}</small></span></button>`).join('')}</div>
      <div class="rec-line">Đề xuất: <b>${g.rec}</b> — ${esc(g.why)} · <i>Bấm chọn = nhắn cho Parent.</i></div>
      <div style="display:flex;gap:8px"><textarea placeholder="Hoặc trả lời tự do…"></textarea><button class="btn sm" data-answer="free" style="align-self:flex-end">Gửi</button></div>
    </div></div></div>`;
}
function roomTabHTML(r){
  if(roomTab==='timeline'){const ev=EVENTS[r.id]||[];return `<div class="panel-b"><ul class="tl">${ev.map(e=>`<li><span class="time">${hm(e.m)}</span>${av(e.role)}<div><div class="what">${e.t}</div><div class="ev">${e.type} · ${ROLES[e.role].name}</div></div><span class="cost">${evTok(e.c)}</span></li>`).join('')}</ul></div>`;}
  if(roomTab==='chat') return chatHTML(r);
  if(roomTab==='tokens'){
    const tot=totTok(r)||1, max=Math.max(...rolesOf(r).map(k=>r.tok[k]),1);
    const runs={product:1,scout:2,parent:9,implementer:3,verifier:3,reviewer:1};
    return `<div class="panel-b"><div style="margin-bottom:12px">${tokBar(r)}</div><table><tr><th>Phòng ban</th><th>Model</th><th class="num">Lượt chạy</th><th class="num">Input</th><th class="num">Output</th><th class="num">Tổng</th><th style="width:28%"></th></tr>
      ${rolesOf(r).map(k=>{const t=r.tok[k];return `<tr><td><div class="who">${av(k,'',r.bots[k])}${ROLES[k].name}</div></td><td class="mono">${esc(r.models[k])}</td><td class="num">${t?runs[k]:0}</td><td class="num">${t?fmtTok(t*.86):'—'}</td><td class="num">${t?fmtTok(t*.14):'—'}</td><td class="num"><b>${t?fmtTok(t):'—'}</b></td><td><div class="hbar" style="grid-template-columns:1fr 44px;margin:0"><div class="track"><i style="width:${t/max*100}%;background:${ROLES[k].color}"></i></div><span class="num muted" style="font-size:11px">${Math.round(t/tot*100)}%</span></div></td></tr>`;}).join('')}

  if(d.type==='repro') body=`<h3 style="margin:0 0 8px;font-size:14px">📸 Ảnh lỗi · 375px</h3><div class="cmp" style="max-width:360px"><span class="tagL">TRƯỚC</span>${phoneHTML('bad')}</div><div class="shot-cap"><span>tmp/shots/bug-1-before.png</span></div><h3 style="margin:4px 0 8px;font-size:14px">🧩 Nguyên nhân (DOM / console)</h3><pre class="term"><span class="c">// computed style của .joy-tier__show-all</span>
pointer-events: <span class="r">none</span>   <span class="y">← kế thừa từ .joy-tier__wrapper (TierBenefits.js:58)</span>

function mountViewer(scope){

function selectDoc(id){

function chatPush(rid,who,t,state){const c=CHAT[rid]=CHAT[rid]||{unread:0,msgs:[]};const msg={who,m:0,t,state:state||'sent',at:Date.now()};c.msgs.push(msg);if(who==='parent'&&!(currentRoom===rid&&roomTab==='chat'&&$('#view-room').classList.contains('on')))c.unread++;return msg;}
function chatHTML(r){
  const c=CHAT[r.id]=CHAT[r.id]||{unread:0,msgs:[]};c.unread=0;
  const busy=r.bots.parent==='working';
  const msgs=c.msgs.map(x=>`<div class="msg ${x.who==='me'?'me':''}">${x.who==='me'?'<div class="av" style="--role:#2f6f5e;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent)">A</div>':av('parent','',r.bots.parent)}<div><div class="bub">${x.t}</div><div class="meta">${x.who==='me'?'Anh':'Parent'} · ${x.at?new Date(x.at).toTimeString().slice(0,5):hm(x.m)}${x.who==='me'?(x.state==='queued'?' · ⏳ đang xếp hàng':' · ✓ đã gửi'):''}</div></div></div>`).join('');
  return `<div class="chat"><div class="chat-log" id="chatLog">${msgs||'<div class="empty-doc">Chưa có tin nhắn</div>'}</div>
    <div class="chat-status">${av('parent','',r.bots.parent)}<span><b>Parent</b> · ${busy?'đang chạy việc, tin của anh sẽ <b>xếp hàng</b> và gửi khi Parent rảnh hoặc dừng ở gate':r.gate?'đang chờ anh trả lời 🚦':'đang rảnh, gửi ngay'}</span></div>
    <div class="quick">${['Đang làm gì vậy?','Tóm tắt tiến độ','commit','Dừng lại đã'].map(q=>`<button class="chipf" data-quick="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <div class="chat-box"><textarea id="chatInput" placeholder="Nhắn cho Parent của phòng này… (Enter để gửi, Shift+Enter xuống dòng)"></textarea><button class="btn primary" id="chatSend" data-chat-room="${r.id}">Gửi</button></div></div>`;
}
function sendChat(rid,text){
  text=text.trim();if(!text)return;
  const r=rooms.find(x=>x.id===rid);const busy=r.bots.parent==='working';
  const msg=chatPush(rid,'me',esc(text),busy?'queued':'sent');
  rerenderChat();
  const reply=()=>{
    if(/^commit$/i.test(text)&&r.gate&&r.gate.kind==='commit'){answerGate(rid,'A');return;}
    const lines={
      'Đang làm gì vậy?':`Đang ở <b>${esc(r.phase.label)}</b>. ${Object.entries(r.tasks).map(([k,v])=>`${ROLES[k].name}: ${esc(v)}`).join(' · ')||'Không có việc đang chạy.'}`,
      'Tóm tắt tiến độ':`Bước hiện tại: <b>${stepsFor(r)[Math.min(r.stepIdx,stepsFor(r).length-1)]}</b>. ${buildDocs(r).filter(d=>d.available).length} hồ sơ đã có.<br>${DL(rid,'progress','✅ Tiến độ')}`,
      'Dừng lại đã':'Ok anh, em dừng sau khi bước hiện tại xong và ghi NOW vào <code>progress.md</code>.'
    };
    chatPush(rid,'parent',lines[text]||`Em nhận rồi: “${esc(text)}”. Em sẽ xử lý theo flow và báo lại kèm hồ sơ.`);
    rerenderChat();renderFloor();
  };
  if(busy){setTimeout(()=>{msg.state='sent';rerenderChat();toast('📨 Parent đã rảnh, tin của anh đã được gửi');setTimeout(reply,1200);},2500);}
  else setTimeout(reply,1000);
}
function rerenderChat(){
  if(!(roomTab==='chat'&&$('#view-room').classList.contains('on')))return;
  const r=rooms.find(x=>x.id===currentRoom);const keep=($('#chatInput')||{}).value||'';
  $('#roomTabBody').innerHTML=chatHTML(r);$('#chatInput').value=keep;const log=$('#chatLog');log.scrollTop=log.scrollHeight;
  document.querySelectorAll('.tab[data-rtab="chat"]').forEach(t=>t.textContent='💬 Chat với Parent');
}
function answerGate(roomId,key){
  const r=rooms.find(x=>x.id===roomId);if(!r||!r.gate)return;
  const g=r.gate,opt=g.options.find(o=>o.k===key);
  (EVENTS[r.id]=EVENTS[r.id]||[]).unshift({m:0,role:'parent',type:'gate.answered',t:`Anh chọn <b>${key==='free'?'trả lời tự do':key+' — '+esc(opt.l)}</b> → phòng chạy tiếp`,c:0});
  r.gate=null;r.status='working';
  Object.keys(r.bots).forEach(k=>{if(r.bots[k]==='waiting'||r.bots[k]==='error')r.bots[k]='working';});
  if(g.kind==='commit'){r.bots.parent='working';r.bots.reviewer='working';r.tasks={reviewer:'Review 1 vòng',parent:'Đã commit, chạy review'};r.stepIdx=5;r.phase.label='Review';}
  if(g.kind==='gate1'){r.stepIdx=1;r.bots.scout='working';r.bots.parent='working';r.tasks={scout:'Gate 2: gom facts mọi surface',parent:'Chờ facts'};r.phase.label='Gate 2 — Lên plan';}
  if(g.kind==='park'){r.tasks={implementer:'Fix race condition (opus)'};}
  chatPush(r.id,'me',key==='free'?'(trả lời tự do)':`${key} — ${opt.l}`);
  chatPush(r.id,'parent',`Đã nhận <b>${key==='free'?'câu trả lời':key}</b>, em chạy tiếp ngay. Có hồ sơ mới em sẽ báo trong tủ hồ sơ.`);
  toast(`✅ Đã gửi quyết định cho Parent · <b>${esc(r.title)}</b>`);
  renderAll();if(currentRoom===roomId&&$('#view-room').classList.contains('on'))renderRoom();
}

function hbMainHTML(it){
  const scope='<span class="scope '+(it.scope==='core'?'core':it.scope==='pack'?'kit':it.scope==='prof'?'prof':'ro')+'">'+esc(it.group.toUpperCase())+'</span>';
  const ro=it.scope==='ro';
  const hist=(HB_HIST[it.id]||[]).map(h=>`<div class="std"><div><b>${esc(h[1])}</b><div class="src">${h[0]} · ${esc(h[2])}</div></div></div>`).join('')||'<div class="muted">Chưa có thay đổi nào.</div>';
  let body='';
  if(it.kind==='role'){
    const running=rooms.filter(r=>r.bots[it.id]==='working').length;
    body=`<div class="impact">⚡ Ảnh hưởng: role <b>${esc(it.title)}</b> chạy ở bước <b>${esc(it.blocks)}</b>. ${running?`<b>${running} phòng</b> đang có ${esc(it.title)} chạy, sẽ dùng bản mới ở <b>lần gọi tiếp theo</b> (lần đang chạy không đổi).`:'Không phòng nào đang chạy role này.'}</div>`+
      Object.entries(it.sec).map(([k,v])=>`<div class="sec"><div class="sec-h">${k} <small>${{'Does':'làm gì','Does not':'không được làm','Input':'đầu vào','Output':'đầu ra','Stop when':'dừng khi'}[k]}</small><div class="spacer"></div>${ro?'':(hbEdit===k?`<button class="btn sm" data-hb-cancel>Huỷ</button><button class="btn sm primary" data-hb-save="${k}">Xem diff →</button>`:`<button class="btn sm" data-hb-edit="${k}">✏️ Sửa</button>`)}</div>
        <div class="sec-b">${hbEdit===k?`<textarea id="hbText">${esc(v.map(x=>'- '+x).join('\n'))}</textarea>`:`<ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}</div></div>`).join('')+
      `<div class="sec"><div class="sec-h">Standards <small>luật rút ra từ góp ý của anh · ${it.std.length} dòng</small></div><div class="sec-b">
        ${it.std.map((s,i)=>`<div class="std"><div>${esc(s.t)}<div class="src">source: ${esc(s.src)}</div></div><button class="btn sm ghost" data-hb-delstd="${i}" title="Xoá dòng này">🗑</button></div>`).join('')}
        <div class="add-std"><input type="text" id="hbStdText" placeholder="Thêm Standard mới, VD: Luôn chụp 375px trước 1280px"><input type="text" id="hbStdSrc" placeholder="Nguồn / câu anh nói (tuỳ chọn)" style="max-width:260px"><button class="btn sm primary" id="hbAddStd">＋ Thêm → xem diff</button></div></div></div>`;
  } else {
    body=`<div class="sec"><div class="sec-h">Nội dung<div class="spacer"></div>${ro?'<span class="muted" style="font-weight:400;font-size:12px">Hook sửa qua chat session (đụng code chạy)</span>':(hbEdit==='md'?`<button class="btn sm" data-hb-cancel>Huỷ</button><button class="btn sm primary" data-hb-save="md">Xem diff →</button>`:`<button class="btn sm" data-hb-edit="md">✏️ Sửa</button>`)}</div><div class="sec-b">${hbEdit==='md'?`<textarea id="hbText">${esc(it.md)}</textarea>`:`<div class="doc-body">${md(it.md)}</div>`}</div></div>`;
  }
  return `<div class="hb-head">${it.kind==='role'&&ROLES[it.id]?av(it.id,'lg',''):`<span style="font-size:24px">${it.icon}</span>`}<div style="min-width:0;flex:1"><h3>${esc(it.title)}</h3><div class="mono muted">${esc(it.file)}</div></div>${scope}${it.kind==='role'?`<span class="badge b-muted">model: ${esc(it.model)}</span>`:''}</div>
    <div class="hb-body">${body}<div class="sec"><div class="sec-h">🕘 Lịch sử thay đổi</div><div class="sec-b">${hist}</div></div></div>`;
}

function show(v){
  const sh=document.getElementById('sheet');if(sh)sh.classList.toggle('on',v!=='floor');
  if(v==='floor'&&window.Office3D)Office3D.resize();
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='view-'+v));
  document.querySelectorAll('.nav[data-view]').forEach(n=>n.classList.toggle('active',n.dataset.view===v||(v==='room'&&n.dataset.view==='floor')));
  $('#pageTitle').textContent=TITLES[v][0];$('#pageSub').textContent=TITLES[v][1];
  if(v==='hq')renderHQView();if(v==='gates')renderGates();if(v==='reports')renderReports();if(v==='staff')renderStaff();if(v==='harness')renderHarness();if(v==='room')renderRoom();
  window.scrollTo({top:0});
}
function zoomDoc(){

      <div class="vbody" style="display:flex;flex-direction:column;gap:12px;max-width:760px"><div class="field"><label>Tên dự án</label><input type="text" id="npName" value="Shop Y"></div><div class="field"><label>Thư mục</label><input type="text" id="npPath" value="~/Project/shop-y"></div>
      <div class="field"><label>Pack</label><div class="radio-cards"><button class="rc on"><b>💻 Coding (my-ship)</b><small>Repo code: worktree, gate, K0–K7. Profile 14 mục.</small></button><button class="rc"><b>📝 Content</b><small>Nghiên cứu → viết → duyệt → đăng.</small></button></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-unzoom>Huỷ</button><button class="btn primary" id="npPreview">Xem các file sẽ tạo →</button></div></div>`;$('#zoom').classList.add('on');return;}
    case 'npPreview':{const n=$('#npName').value.trim()||'Dự án mới',p=$('#npPath').value.trim(),key=n.toLowerCase().replace(/\s+/g,'-');
      return showDiff(`Thêm tầng "${n}" (pack Coding)`,[
        {file:'~/ai-office/projects.json',lines:['  "joy": { "path": "~/Project/Joy", "pack": "coding" },',`+ "${key}": { "path": "${p}", "pack": "coding" }`]},
        {file:`${p}/.claude/ship-profile.md  (file mới, mẫu 14 mục của pack Coding)`,lines:[`+ # Ship profile — ${n}`,'+ ## §1 Repo basics','+ - Base branch: origin/main','+ ## §2 Surfaces','+ ...','+ ## §14 Design system for mockups']},
        {file:`${p}/  (cài pack)`,lines:[`+ bash my-ship/install.sh ${p}`]}],
        ()=>{PROJECTS[key]={name:n,pack:'coding',path:p,icon:'🆕'};HB.push({id:'p-'+key,kind:'doc',group:'Profile: '+n,icon:'📌',title:'ship-profile.md',file:p+'/.claude/ship-profile.md',scope:'prof',md:'## §1 Repo basics\n- Base branch: origin/main\n\n*(điền đủ 14 mục)*'});hbSel='p-'+key;$('#projSel').insertAdjacentHTML('beforeend',`<option value="${key}">🆕 ${esc(n)} · Coding</option>`);hbLog('p-'+key,'Tạo tầng mới','web · thêm dự án');});}
    case 'hbNewPack':return showDiff('Thêm pack mới "Support" (khung trống, dùng lại Core)',[
        {file:'packs/support/office.yaml  (file mới)',lines:['+ name: Support','+ rooms: tickets/<slug>/','+ steps: [Đọc ticket, Tìm nguyên nhân, Đề xuất, Gửi]','+ roles: [parent, triage, debugger]','+ labels: { triage.md: "Phân loại ticket", rootcause.md: "Nguyên nhân gốc" }']},
        {file:'packs/support/roles/triage.md  (file mới)',lines:['+ # Role: triage','+ ## Does','+ ## Does not','+ ## Input','+ ## Output','+ ## Stop when','+ ## Standards']}],
        ()=>{HB.push({id:'triage',kind:'role',group:'Phòng mới · workflow',icon:'🎫',title:'triage',file:'packs/support/roles/triage.md',scope:'pack',model:'sonnet',blocks:'Đọc ticket',sec:{'Does':['(điền)'],'Does not':['(điền)'],'Input':['(điền)'],'Output':['(điền)'],'Stop when':['(điền)']},std:[]});hbSel='triage';hbLog('triage','Tạo pack Support','web · thêm pack');});

    case 'aiGo':{const ask=$('#aiAsk').value.trim();$('#aiOut').innerHTML=`<div class="who">${av('parent','','working')}<span class="muted">Đang đọc harness và soạn thay đổi…</span></div>`;
      setTimeout(()=>{hbSel='verifier';showDiff(`AI soạn theo yêu cầu: "${ask.slice(0,80)}"`,[
        {file:'.claude/roles/verifier.md',lines:['  ## Standards','  - CSS/layout: render and screenshot at several widths.','+ - Screenshot 375px first, then 1280px; the width goes in the file name (e.g. p2-after-375.png) (source: 2026-10-12 "'+ask.slice(0,40)+'…")']},
        {file:'.claude/workflow/blocks/K4-confirm.md',lines:['  2. Screenshot in the same state as the before-shot → tmp/shots/<bug>-3-after.png.','- 2. Screenshot in the same state as the before-shot → tmp/shots/<bug>-3-after.png.','+ 2. Screenshot in the same state as the before-shot → tmp/shots/<bug>-3-after-<width>.png, 375px first.']}],
        ()=>{const v=HB.find(x=>x.id==='verifier');v.std.push(ST('Screenshot 375px first, then 1280px; width in the file name.','2026-10-12 · nhờ AI sửa trên web'));hbLog('verifier','Thêm Standard chụp 375px trước (AI soạn)','web · nhờ AI');});},1200);return;}
  }
});
$('#assignModal').addEventListener('click',e=>{if(e.target.id==='assignModal')closeAssign();});
document.addEventListener('input',e=>{if(e.target.id==='hbSearch'){hbFilter=e.target.value.toLowerCase();const pos=e.target.selectionStart;renderHarness();const s=$('#hbSearch');s.focus();s.setSelectionRange(pos,pos);}});
$('#zoom').addEventListener('click',e=>{if(e.target.id==='zoom')$('#zoom').classList.remove('on');});
$('#projSel').innerHTML=`<option value="all">🏢 Toàn công ty</option>`+Object.entries(PROJECTS).map(([k,p])=>`<option value="${k}">${p.icon} ${p.name} · ${PACKS[p.pack].name}</option>`).join('');
$('#projSel').addEventListener('change',e=>{proj=e.target.value;filter='all';renderAll();if(!$('#view-floor').classList.contains('on'))show('floor');});
document.addEventListener('keydown',e=>{if(e.target.id==='hqInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value='';hqSend(v);return;}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=e.target.value;e.target.value='';sendChat(currentRoom,v);return;}if(e.key==='Escape'){closeAssign();$('#drawer').classList.remove('on');$('#zoom').classList.remove('on');}});
const tip=$('#tip');
document.addEventListener('mouseover',e=>{const d=e.target.closest('[data-tip-role]');if(!d){tip.classList.remove('on');return;}
  const r=ROLES[d.dataset.tipRole];tip.innerHTML=`<b>${r.name} · ${r.vn}</b>${STATE_VN[d.dataset.tipState]}${d.dataset.tipModel?' · '+d.dataset.tipModel:''}${d.dataset.tipTask?'<br>'+d.dataset.tipTask:''}${d.dataset.tipDocs?'<br>📁 '+d.dataset.tipDocs+' hồ sơ — bấm để mở':''}`;tip.classList.add('on');});
document.addEventListener('mousemove',e=>{if(!tip.classList.contains('on'))return;tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+16)+'px';});
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('aio-theme',t);}catch(_){}document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));}
(function(){let t=null;try{t=localStorage.getItem('aio-theme');}catch(_){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';setTheme(t);})();
window.addEventListener('resize',()=>document.querySelectorAll('.cmp').forEach(b=>{const d=b.querySelector('.top>div');if(d)d.style.width=b.clientWidth+'px';}));
setTimeout(()=>{const r=rooms.find(x=>x.id==='r1');if(!r||r.status!=='working')return;
  r.bots.implementer='done';r.bots.verifier='working';r.tasks={verifier:'K4: chụp 375px + 1280px, revert check',parent:'Chờ verifier'};
  EVENTS.r1.forEach(e=>e.m+=0.2);EVENTS.r1.unshift({m:0,role:'implementer',type:'doc.ready',t:'📄 Báo cáo code Phase 3 đã vào hồ sơ → trigger <code>verifier.run</code>',c:.21});
  renderAll();if(currentRoom==='r1'&&$('#view-room').classList.contains('on'))renderRoom();toast('📄 Store credit: hồ sơ mới "Báo cáo code Phase 3" · verifier tự chạy');},9000);
try{history.scrollRestoration='manual';}catch(_){}
window.scrollTo(0,0);
renderAll();
</script>
<style>
.plan-wrap{position:absolute;inset:0;overflow:auto;cursor:grab;background:var(--bg)}
.plan-wrap.drag{cursor:grabbing}
.plan{position:relative;transform-origin:0 0;padding:120px 48px 110px;display:flex;gap:44px;align-items:flex-start;width:max-content}
.zone{position:relative;border:7px solid var(--wall);border-radius:20px;padding:64px 26px 26px;box-shadow:0 18px 40px rgba(0,0,0,.08)}
.zone-sign{position:absolute;top:-24px;left:26px;background:var(--text);color:var(--surface);padding:8px 16px;border-radius:12px;font-weight:700;font-size:15px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;white-space:nowrap}
.zone-sign small{font-weight:500;opacity:.75;font-size:12px}
.zone-sign .w{background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.zone-door{position:absolute;bottom:-7px;left:60px;width:70px;height:7px;background:var(--bg)}
.lobby{width:300px;background:repeating-linear-gradient(45deg,var(--floor) 0 22px,var(--floor-line) 22px 23px);display:flex;flex-direction:column;gap:26px;align-items:center}
.dept{background:repeating-linear-gradient(90deg,var(--wood) 0 46px,var(--wood-line) 46px 48px);display:grid;grid-template-columns:repeat(3,310px);gap:30px 26px}
.dept.content{background:repeating-linear-gradient(0deg,var(--wood) 0 40px,var(--wood-line) 40px 42px)}
.empty-lot{width:330px;height:300px;border:3px dashed var(--border-strong);border-radius:20px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;background:transparent;font:inherit}
.empty-lot:hover{border-color:var(--accent);color:var(--accent)}
.empty-lot b{display:block;font-size:16px;margin:8px 0 4px}
.group{position:relative;height:270px;cursor:pointer;border-radius:24px}
.group:hover .rug{filter:brightness(1.04);outline:2px solid var(--accent)}
.rug{position:absolute;left:14px;right:14px;top:36px;bottom:12px;border-radius:50%;background:color-mix(in srgb,var(--st) 14%,transparent);border:2px solid color-mix(in srgb,var(--st) 35%,transparent);transition:filter .15s}
.group.waiting .rug{animation:rugPulse 1.8s infinite}
@keyframes rugPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.table{position:absolute;left:50%;top:158px;width:150px;height:78px;transform:translate(-50%,-50%);border-radius:40px;background:var(--desk);border-bottom:7px solid var(--desk-edge);box-shadow:0 8px 14px rgba(0,0,0,.12);display:grid;place-items:center}
.table .papers{display:flex;gap:8px;opacity:.85}
.table .papers i{display:block;width:16px;height:12px;border-radius:2px;background:#9aa1ab;position:relative}
.table .papers i.on{background:#7fe0bf;box-shadow:0 0 8px #7fe0bf}
.plaque{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow);max-width:290px;z-index:3}
.plaque .t{overflow:hidden;text-overflow:ellipsis;max-width:170px}
.plaque .kind{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px}
.kind.bug{background:var(--danger-soft);color:var(--danger)}.kind.feat{background:var(--info-soft);color:var(--info)}.kind.job{background:var(--accent-soft);color:var(--accent)}
.flag{position:absolute;top:30px;right:6px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;z-index:4;box-shadow:var(--shadow);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flag.err{background:var(--danger)}.flag.done{background:var(--ok)}
.member{position:absolute;width:70px;transform:translate(-50%,-50%);text-align:center;z-index:2}
.member .face{width:52px;height:52px;margin:0 auto;border-radius:50%;background:color-mix(in srgb,var(--role) 22%,var(--surface));border:3px solid var(--ring);overflow:hidden;box-shadow:var(--shadow);transition:transform .15s}
.member .face svg{width:100%;height:100%;display:block}
.member:hover .face{transform:scale(1.12)}
.member .nm{font-size:10px;font-weight:600;margin-top:2px;background:var(--surface);border-radius:99px;padding:0 6px;display:inline-block;border:1px solid var(--border)}
.member.idle .face{opacity:.6;filter:saturate(.5)}
.member.working .face{animation:bob 1.8s ease-in-out infinite}
.member .bb{position:absolute;top:-10px;right:2px;font-size:11px;background:var(--surface);border:1px solid var(--border-strong);border-radius:99px;padding:0 5px;line-height:16px}
.member.lead .nm{background:var(--text);color:var(--surface);border-color:var(--text)}
.member.lead .face{width:58px;height:58px}
.reception{width:230px;height:92px;border-radius:0 0 90px 90px;background:var(--desk);border-bottom:8px solid var(--desk-edge);position:relative;margin-top:44px;box-shadow:0 10px 18px rgba(0,0,0,.12);cursor:pointer}
.reception .sec{position:absolute;left:50%;top:-46px;transform:translateX(-50%);text-align:center}
.reception .sec .face{width:66px;height:66px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);background:color-mix(in srgb,#b05a8a 22%,var(--surface));margin:0 auto;animation:bob 2s ease-in-out infinite}
.reception .sec .face svg{width:100%;height:100%}
.reception .cap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:700;font-size:13px}
.board{width:250px;background:var(--surface);border:6px solid var(--desk-edge);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;font-size:12px}
.board h4{margin:0 0 6px;font-size:13px}
.board .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.board .row:last-child{border-bottom:0}
.board.notice{border-color:var(--warn)}
.plant{font-size:34px;line-height:1}
.zoombar{position:fixed;right:18px;bottom:84px;z-index:25;display:flex;flex-direction:column;gap:6px}
.zoombar button{width:38px;height:38px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);font-size:16px;box-shadow:var(--shadow)}
:root{--wall:#cdbfa6;--wood:#efe3cc;--wood-line:#e3d4b8}
:root[data-theme="dark"]{--wall:#3d4048;--wood:#2a2621;--wood-line:#332e27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#3d4048;--wood:#2a2621;--wood-line:#332e27}}
</style>
<script>
(function(){
  const STC={working:'var(--info)',waiting:'var(--warn)',error:'var(--danger)',done:'var(--ok)',idle:'var(--faint)'};
  const BUB={working:'…',waiting:'🚦',error:'⚠️',done:'✓'};
  const kindOf=r=>r.flow==='/news-daily'?['job','BẢN TIN']:/^bugfix\//.test(r.branch)?['bug','BUG']:['feat','FEATURE'];
  let scale=1, wrap, plan;
  function seats(n){ // Parent at the head (top), others around the table
    const cx=155,cy=158,rx=128,ry=86,out=[];
    for(let i=0;i<n;i++){const a=-Math.PI/2+i*(2*Math.PI/n);out.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)+(i===0?-6:0)]);}
    return out;
  }
  function groupHTML(r){
    const roles=rolesOf(r), order=['parent',...roles.filter(x=>x!=='parent')], pos=seats(order.length);
    const [kc,kl]=kindOf(r), docs=buildDocs(r), nNew=docs.filter(d=>d.state==='new').length;
    const flag=r.status==='waiting'?`<div class="flag">🚦 ${esc(r.gate.title)}</div>`:r.status==='error'?`<div class="flag err">⚠️ Cần anh xử lý</div>`:r.status==='done'?`<div class="flag done">✓ Xong · chờ push</div>`:'';
    const mem=order.map((role,i)=>{const st=r.bots[role]||'idle';return `<div class="member ${st} ${role==='parent'?'lead':''}" style="left:${pos[i][0]}px;top:${pos[i][1]}px;--role:${ROLES[role].color};--ring:${STC[st]}" data-desk-role="${role}" data-desk-room="${r.id}" data-tip-role="${role}" data-tip-state="${st}" data-tip-model="${esc(r.models[role]||'')}" data-tip-task="${esc(r.tasks[role]||'')}" data-tip-docs="${docs.filter(d=>d.role===role&&d.available).length}">
        ${BUB[st]?`<span class="bb">${BUB[st]}</span>`:''}<div class="face">${avatarSVG(role,st)}</div><span class="nm">${role==='parent'?'👑 ':''}${ROLES[role].name}</span></div>`;}).join('');
    const papers=order.slice(1).map(role=>`<i class="${r.bots[role]==='working'?'on':''}"></i>`).join('');
    return `<div class="group ${r.status}" data-room="${r.id}" style="--st:${STC[r.status==='waiting'?'waiting':r.status]}">
      <div class="plaque"><span class="kind ${kc}">${kl}</span><span class="t">${esc(r.title)}</span>${nNew?`<span class="badge b-working">${nNew} mới</span>`:''}</div>
      ${flag}<div class="rug"></div><div class="table"><div class="papers">${papers}</div></div>${mem}</div>`;
  }
  function deptHTML(k){
    const p=PROJECTS[k], rs=rooms.filter(r=>r.proj===k), w=rs.filter(r=>r.gate).length;
    const order={waiting:0,error:1,working:2,done:3};
    return `<section class="zone dept ${p.pack==='content'?'content':''}" data-dept-zone="${k}">
      <div class="zone-sign">${p.icon} PHÒNG ${esc(p.name.toUpperCase())}<small>workflow ${esc(p.wf||'')} · ${rs.length} nhóm</small>${w?`<span class="w">${w} chờ anh</span>`:''}</div>
      <div class="zone-door"></div>
      ${rs.sort((a,b)=>order[a.status]-order[b.status]).map(groupHTML).join('')||'<div class="muted">Chưa có nhóm nào</div>'}</section>`;
  }
  function lobbyHTML(){
    const jobs=SCHEDULE.filter(j=>j.on).slice(0,4), waits=rooms.filter(r=>r.gate);
    return `<section class="zone lobby"><div class="zone-sign">🛎️ SẢNH · THƯ KÝ<small>chung cả công ty</small></div>
      <div class="reception" data-view="hq"><div class="sec"><div class="face">${avatarSVG('secretary','working')}</div></div><div class="cap">Thư ký · bấm để chat</div></div>
      <div class="board notice" data-view="gates"><h4>📌 Bảng tin · chờ anh (${waits.length})</h4>${waits.map(r=>`<div class="row"><span>${PROJECTS[r.proj].icon} ${esc(r.title.slice(0,26))}${r.title.length>26?'…':''}</span><b style="color:var(--warn)">🚦</b></div>`).join('')||'<div class="muted">Không có gì 🎉</div>'}</div>
      <div class="board" data-view="hq"><h4>🗓️ Lịch trực</h4>${jobs.map(j=>`<div class="row"><span>${esc(j.name)}</span><span class="muted">${esc(j.next)}</span></div>`).join('')}</div>
      <div style="display:flex;gap:40px"><span class="plant">🪴</span><span class="plant">🪴</span></div></section>`;
  }
  function render(){
    const sc=document.getElementById('scene');
    if(!wrap){sc.innerHTML='<div class="plan-wrap" id="planWrap"><div class="plan" id="plan"></div></div>';wrap=document.getElementById('planWrap');plan=document.getElementById('plan');bindPan();
      document.body.insertAdjacentHTML('beforeend','<div class="zoombar"><button data-zoom-step="1" title="Phóng to">＋</button><button data-zoom-step="-1" title="Thu nhỏ">－</button><button data-zoom-step="0" title="Vừa màn hình">⤢</button></div>');}
    const keys=Object.keys(PROJECTS).filter(k=>proj==='all'||k===proj);
    plan.innerHTML=(proj==='all'?lobbyHTML():'')+keys.map(deptHTML).join('')+(proj!=='all'?'':`<button class="empty-lot" data-new-dept><div><div style="font-size:30px">＋</div><b>Phòng ban mới</b><span>Bảo Thư ký dựng: dự án nào,<br>workflow ra sao</span></div></button>`);
    plan.style.transform=`scale(${scale})`;
  }
  function bindPan(){
    let down=null;
    wrap.addEventListener('pointerdown',e=>{if(e.target.closest('[data-room],[data-desk-role],[data-view],[data-new-dept],button'))return;down={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop};wrap.classList.add('drag');});
    window.addEventListener('pointermove',e=>{if(!down)return;wrap.scrollLeft=down.l-(e.clientX-down.x);wrap.scrollTop=down.t-(e.clientY-down.y);});
    window.addEventListener('pointerup',()=>{down=null;wrap&&wrap.classList.remove('drag');});
    wrap.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom(e.deltaY<0?1:-1);},{passive:false});
  }
  function zoom(step){
    if(step===0){const w=plan.scrollWidth/scale;scale=Math.max(.45,Math.min(1,(wrap.clientWidth-20)/w));}
    else scale=Math.max(.45,Math.min(1.4,scale+step*.12));
    plan.style.transform=`scale(${scale})`;
  }
  document.addEventListener('click',e=>{const dv=e.target.closest('div[data-view]');if(dv){show(dv.dataset.view);return;}});
  document.addEventListener('click',e=>{const z=e.target.closest('[data-zoom-step]');if(z)zoom(+z.dataset.zoomStep);});
  window.Office3D={update:render,resize(){},focus(k){render();if(k==='all'){wrap.scrollTo({left:0,top:0,behavior:'smooth'});return;}const z=plan.querySelector(`[data-dept-zone="${k}"]`);if(z)wrap.scrollTo({left:z.offsetLeft*scale-60,top:0,behavior:'smooth'});}};
  render();
})();
</script>
