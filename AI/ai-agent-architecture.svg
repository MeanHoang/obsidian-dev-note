<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="1000" rx="0" fill="#f8fafc"/>

  <!-- title -->
  <text x="640" y="46" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">AI AGENT — Cấu trúc &amp; vòng lặp hoạt động</text>
  <text x="640" y="74" text-anchor="middle" font-size="15" fill="#64748b">Agent = Model (bộ não) + Harness (cơ thể: loop, tools, memory, context, safety)</text>

  <!-- ================= USER ================= -->
  <rect x="40" y="380" width="150" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="115" y="440" text-anchor="middle" font-size="40">👤</text>
  <text x="115" y="478" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">USER</text>
  <text x="115" y="500" text-anchor="middle" font-size="12" fill="#92400e">"Sửa bug file app.js"</text>

  <!-- ================= HARNESS ================= -->
  <rect x="250" y="110" width="620" height="780" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="none"/>
  <text x="560" y="145" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">HARNESS (Claude Code, Cursor, Codex CLI…)</text>
  <text x="560" y="166" text-anchor="middle" font-size="12.5" fill="#3b82f6">Phần mềm bao quanh model — thực thi mọi thứ model "xin" làm</text>

  <!-- Context assembly -->
  <rect x="280" y="190" width="270" height="190" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="415" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">① GHÉP CONTEXT</text>
  <rect x="298" y="232" width="234" height="30" rx="6" fill="#dbeafe"/>
  <text x="415" y="252" text-anchor="middle" font-size="12" fill="#1e3a8a">System prompt (luật, môi trường)</text>
  <rect x="298" y="268" width="234" height="30" rx="6" fill="#dbeafe"/>
  <text x="415" y="288" text-anchor="middle" font-size="12" fill="#1e3a8a">Memory + lịch sử hội thoại</text>
  <rect x="298" y="304" width="234" height="30" rx="6" fill="#dbeafe"/>
  <text x="415" y="324" text-anchor="middle" font-size="12" fill="#1e3a8a">Danh sách tools model được dùng</text>
  <rect x="298" y="340" width="234" height="30" rx="6" fill="#fef3c7"/>
  <text x="415" y="360" text-anchor="middle" font-size="12" fill="#92400e">+ Câu hỏi của user</text>

  <!-- Agent loop -->
  <rect x="280" y="410" width="560" height="290" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="560" y="440" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">② AGENT LOOP — vòng lặp cốt lõi 🔁</text>

  <!-- loop steps -->
  <rect x="305" y="460" width="230" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="420" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Gửi context lên LLM API</text>
  <text x="420" y="495" text-anchor="middle" font-size="11" fill="#3b82f6">(model suy nghĩ, quyết định)</text>

  <rect x="585" y="460" width="230" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="700" y="478" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Model trả về: text HOẶC</text>
  <text x="700" y="495" text-anchor="middle" font-size="11" fill="#3b82f6">tool call ("cho tôi đọc app.js")</text>

  <rect x="585" y="540" width="230" height="44" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="700" y="558" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Harness THỰC THI tool</text>
  <text x="700" y="575" text-anchor="middle" font-size="11" fill="#16a34a">(đọc file, chạy bash, search…)</text>

  <rect x="305" y="540" width="230" height="44" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="420" y="558" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">Nhét kết quả tool vào context</text>
  <text x="420" y="575" text-anchor="middle" font-size="11" fill="#16a34a">→ quay lại gọi model tiếp</text>

  <!-- loop arrows -->
  <line x1="535" y1="482" x2="583" y2="482" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="700" y1="504" x2="700" y2="538" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="583" y1="562" x2="537" y2="562" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="420" y1="538" x2="420" y2="506" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="305" y="620" width="510" height="56" rx="8" fill="#fef9c3" stroke="#facc15"/>
  <text x="560" y="642" text-anchor="middle" font-size="12.5" font-weight="600" fill="#854d0e">Lặp cho đến khi model không gọi tool nữa mà trả lời text cuối cùng</text>
  <text x="560" y="662" text-anchor="middle" font-size="11.5" fill="#a16207">1 task có thể = hàng chục vòng lặp (đọc → sửa → chạy test → sửa tiếp…)</text>

  <!-- Safety -->
  <rect x="280" y="730" width="270" height="130" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="415" y="758" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">🛡 PERMISSION / SAFETY</text>
  <text x="415" y="784" text-anchor="middle" font-size="12" fill="#7f1d1d">Hỏi user trước lệnh nguy hiểm</text>
  <text x="415" y="804" text-anchor="middle" font-size="12" fill="#7f1d1d">Sandbox, allowlist / denylist</text>
  <text x="415" y="824" text-anchor="middle" font-size="12" fill="#7f1d1d">Giới hạn model được đụng vào gì</text>

  <!-- Memory -->
  <rect x="570" y="730" width="270" height="130" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="705" y="758" text-anchor="middle" font-size="15" font-weight="700" fill="#6d28d9">💾 MEMORY / STATE</text>
  <text x="705" y="784" text-anchor="middle" font-size="12" fill="#4c1d95">LLM stateless → harness phải nhớ hộ</text>
  <text x="705" y="804" text-anchor="middle" font-size="12" fill="#4c1d95">Lưu hội thoại, memory ra file</text>
  <text x="705" y="824" text-anchor="middle" font-size="12" fill="#4c1d95">Tóm tắt (compact) khi context đầy</text>

  <!-- context box -> loop arrow -->
  <line x1="415" y1="380" x2="415" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ================= MODEL ================= -->
  <rect x="950" y="150" width="290" height="240" rx="16" fill="#fdf4ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="1095" y="196" text-anchor="middle" font-size="44">🧠</text>
  <text x="1095" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#7e22ce">LLM / MODEL</text>
  <text x="1095" y="254" text-anchor="middle" font-size="12.5" fill="#86198f">(Claude, GPT, Gemini…)</text>
  <rect x="975" y="272" width="240" height="98" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="1095" y="296" text-anchor="middle" font-size="12" fill="#6b21a8">Chỉ làm 1 việc: token in → token out</text>
  <text x="1095" y="316" text-anchor="middle" font-size="12" fill="#6b21a8">❌ Không tự đọc file, chạy lệnh</text>
  <text x="1095" y="336" text-anchor="middle" font-size="12" fill="#6b21a8">❌ Không có bộ nhớ (stateless)</text>
  <text x="1095" y="356" text-anchor="middle" font-size="12" fill="#6b21a8">✅ Suy luận, lập kế hoạch, quyết định</text>

  <!-- ================= TOOLS / ENV ================= -->
  <rect x="950" y="470" width="290" height="400" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1095" y="504" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d">🔧 TOOLS / MÔI TRƯỜNG THẬT</text>
  <text x="1095" y="524" text-anchor="middle" font-size="12" fill="#16a34a">"Tay chân + giác quan" của agent</text>

  <rect x="975" y="542" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="1095" y="567" text-anchor="middle" font-size="13" fill="#14532d">📂 Filesystem — Read / Write / Edit</text>
  <rect x="975" y="590" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="1095" y="615" text-anchor="middle" font-size="13" fill="#14532d">⌨️ Terminal — chạy bash, test, build</text>
  <rect x="975" y="638" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="1095" y="663" text-anchor="middle" font-size="13" fill="#14532d">🌐 Web — search, fetch tài liệu</text>
  <rect x="975" y="686" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="1095" y="711" text-anchor="middle" font-size="13" fill="#14532d">🔌 API bên ngoài (MCP, DB, Slack…)</text>
  <rect x="975" y="734" width="240" height="40" rx="8" fill="#dcfce7"/>
  <text x="1095" y="759" text-anchor="middle" font-size="13" fill="#14532d">🤖 Sub-agents — giao việc song song</text>
  <rect x="975" y="782" width="240" height="64" rx="8" fill="#fef9c3" stroke="#facc15"/>
  <text x="1095" y="807" text-anchor="middle" font-size="12" fill="#854d0e">Model KHÔNG chạm trực tiếp vào đây —</text>
  <text x="1095" y="827" text-anchor="middle" font-size="12" fill="#854d0e">mọi tác động thật đều qua tay harness</text>

  <!-- ================= FLOW ARROWS ================= -->
  <!-- user -> harness -->
  <line x1="190" y1="430" x2="248" y2="430" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="219" y="418" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">1. yêu cầu</text>
  <!-- harness -> user -->
  <line x1="248" y1="490" x2="190" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="219" y="512" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">6. kết quả</text>

  <!-- harness <-> model -->
  <line x1="870" y1="230" x2="948" y2="230" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="909" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">2. gọi API</text>
  <line x1="948" y1="290" x2="870" y2="290" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="909" y="316" text-anchor="middle" font-size="12" font-weight="700" fill="#7e22ce">3. tool call</text>

  <!-- harness <-> tools -->
  <line x1="870" y1="600" x2="948" y2="600" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="909" y="586" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">4. thực thi</text>
  <line x1="948" y1="660" x2="870" y2="660" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="909" y="686" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">5. kết quả tool</text>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="920" width="1200" height="56" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="640" y="944" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Luồng 1 vòng: User hỏi → Harness ghép context → Model quyết định gọi tool → Harness thực thi → kết quả quay về Model → lặp đến khi xong → trả lời User</text>
  <text x="640" y="964" text-anchor="middle" font-size="12" fill="#64748b">Muốn cải thiện agent = cải thiện harness: context tốt hơn, tools tốt hơn, prompt rõ hơn, feedback loop (test/lint) chặt hơn — không nhất thiết phải đổi model</text>
</svg>
